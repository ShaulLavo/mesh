version: "2"

run:
  timeout: 10m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - dupl
    - goconst
    - nestif
    - gocognit
    - errorlint
    - wrapcheck
    - nilerr
    - gocritic
    - misspell
    - revive
    - exhaustive
    - contextcheck
  exclusions:
    paths:
      - ^third_party/
  settings:
    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1003
        - -ST1005
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: false
    nestif:
      min-complexity: 4
    gocognit:
      min-complexity: 15
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      enable-default-rules: false
      rules:
        - name: bare-return
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: error-return
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unreachable-code
        - name: useless-break
        - name: waitgroup-by-value

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - ^third_party/
