version: 2

project_name: mesh

builds:
  - id: mesh-linux
    main: ./cmd/mesh
    binary: mesh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/shaul/mesh/internal/bootstrap.releaseVersion={{ .Tag }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: mesh-darwin
    main: ./cmd/mesh
    binary: mesh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/shaul/mesh/internal/bootstrap.releaseVersion={{ .Tag }}
    goos:
      - darwin
    goarch:
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mesh-linux
    ids:
      - mesh-linux
    formats:
      - tar.gz
    name_template: "mesh_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: mesh-darwin
    ids:
      - mesh-darwin
    formats:
      - tar.gz
    name_template: "mesh_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: mesh
    ids:
      - mesh-darwin
    repository:
      owner: ShaulLavo
      name: mesh
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/ShaulLavo/mesh
    description: Direct, resumable terminal sessions over Tailscale
    url:
      template: "https://github.com/ShaulLavo/mesh/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      verified: github.com/ShaulLavo/mesh/
    binaries:
      - mesh
    # Releases are ad-hoc signed by the Go linker, not with an Apple Developer
    # ID, so Gatekeeper quarantines them and offers only to trash the binary.
    # Homebrew dropped --no-quarantine, so the cask clears it on install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/mesh"],
                           sudo: false
          end

release:
  github:
    owner: ShaulLavo
    name: mesh
