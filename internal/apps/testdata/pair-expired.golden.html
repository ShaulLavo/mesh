<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesh temporary apps</title><style>body{font:16px system-ui;background:#101214;color:#eef0f2;margin:0;padding:24px}main{max-width:680px;margin:auto}a{color:#9ddcff}button,a.button{border:0;border-radius:999px;background:#e9edf2;color:#101214;padding:10px 16px;cursor:pointer;display:inline-block;text-decoration:none}code{font-size:16px;overflow-wrap:anywhere}small{color:#bcc4cb}form{display:inline}.error{color:#ffbab4}</style></head><body><main><h1>Pair this browser</h1><p>Approve from the Mesh host that owns the app:</p><code>mesh app browser approve HOST test-pair-code</code><p>Code: <strong>test-pair-code</strong></p><p>Expires in 10 minutes.</p><p id="pair-status" role="status">Waiting for approval. This page will continue automatically.</p><button id="check-approval" type="button">Check now</button><p><a id="restart-pair" href="/pair" hidden>Get a new code</a></p></main><script>
const checkButton = document.getElementById('check-approval');
const status = document.getElementById('pair-status');
const expiresAt = performance.now() +  0 ;
let checking = false;
let timer;
let finished = false;
function expired() {
  finished = true;
  status.textContent = 'This code expired. Get a new code to try again.';
  checkButton.hidden = true;
  document.getElementById('restart-pair').hidden = false;
}
async function checkApproval() {
  if (checking || finished) return;
  clearTimeout(timer);
  if (performance.now() >= expiresAt) { expired(); return; }
  checking = true;
  checkButton.disabled = true;
  const abort = new AbortController();
  const timeout = setTimeout(() => abort.abort(), 10000);
  try {
    const response = await fetch('/pair/status', {credentials: 'same-origin', cache: 'no-store', signal: abort.signal});
    if (response.status === 200) { finished = true; location.replace("/"); return; }
    if (response.status === 410) { expired(); return; }
    status.textContent = response.status === 202
      ? 'Waiting for approval. This page will continue automatically.'
      : 'Could not check approval. Retrying automatically.';
  } catch {
    status.textContent = 'Could not check approval. Retrying automatically.';
  } finally {
    clearTimeout(timeout);
    checking = false;
    checkButton.disabled = false;
    if (!finished) timer = setTimeout(checkApproval, 1500);
  }
}
checkButton.addEventListener('click', checkApproval);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkApproval(); });
checkApproval();
</script></body></html>
