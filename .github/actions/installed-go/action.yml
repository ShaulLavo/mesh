name: Installed fixture Go cache
description: Keep the installed fixture compilation closure separate from ordinary tests
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: fixture
      with:
        go-version-file: go.mod
        cache: true
        # Source imports and local replacements can change the tagged test closure
        # without changing the root lockfile. Go still validates every build input.
        cache-dependency-path: |
          **/go.mod
          **/go.sum
          **/*.go
          scripts/fixtures/installed_fresh.py
          scripts/fixtures/installed_releases.py
          scripts/fixtures/release_transition.py
          .github/actions/installed-go/action.yml
    - name: Resolve public seed cache identity without compiling
      if: steps.fixture.outputs.cache-hit != 'true'
      id: seed
      shell: bash
      env:
        MODULE_HASH: ${{ hashFiles('go.mod') }}
      run: |
        set -euo pipefail
        architecture=$(go env GOHOSTARCH)
        case "$architecture" in
          amd64) architecture=x64 ;;
          arm64) ;;
          *) echo 'Unsupported installed fixture cache architecture' >&2; exit 2 ;;
        esac
        image=
        if [[ $RUNNER_OS == Linux ]]; then image="${ImageOS}-"; fi
        version=$(go env GOVERSION)
        printf 'key=setup-go-%s-%s-%sgo-%s-%s\n' "$RUNNER_OS" "$architecture" "$image" "${version#go}" "$MODULE_HASH" >> "$GITHUB_OUTPUT"
        printf 'modules=%s\nbuild=%s\n' "$(go env GOMODCACHE)" "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - name: Seed only a fixture miss from the exact public setup-go cache
      if: steps.fixture.outputs.cache-hit != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ steps.seed.outputs.key }}
        path: |
          ${{ steps.seed.outputs.modules }}
          ${{ steps.seed.outputs.build }}
