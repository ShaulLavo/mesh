name: Temporary PR fixture cache population

on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/installed-cache-pr-bootstrap.yml']

permissions:
  contents: read
  actions: read

jobs:
  populate:
    if: github.event.pull_request.number == 435 && github.event.pull_request.draft
    uses: ShaulLavo/mesh/.github/workflows/installed-catchup.yml@46e86c093853a4d6fd3121dd61479b7e673e99f3
    with:
      harness_source: 46e86c093853a4d6fd3121dd61479b7e673e99f3
      reusable_call: true
      calibration_only: true
      calibration_support: fresh
