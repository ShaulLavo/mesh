name: Installed catch-up

on:
  workflow_call:
    inputs:
      harness_source:
        type: string
        default: ''
        description: 'Exact harness checkout SHA for remote calls, independent of producer artifact source'
      reusable_call:
        type: boolean
        default: true
        description: 'Isolate reusable proof runs from direct PR cancellation'
      worker_artifact_prefix:
        type: string
        default: ''
        description: 'Unit3 native preparation artifact prefix, for example update-native'
      worker_artifact_run:
        type: number
        default: 0
        description: 'Pinned producer artifact run ID'
      worker_artifact_source:
        type: string
        default: ''
        description: 'Actual preparation checkout SHA recorded in tools/preparation.json'
      release_version:
        type: string
        default: ''
        description: 'Actual signed main-only draft tag, after signed assets have been uploaded'
      release_source:
        type: string
        default: ''
        description: 'Main source SHA authenticated by the real draft manifest and executable'
      release_run:
        type: number
        default: 0
        description: 'Signed publication run carrying update-publication-trust; defaults to the caller run'
      publication_only:
        type: boolean
        default: false
        description: 'Run the real draft gate using existing reviewed supplemental evidence'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/installed-catchup.yml'
      - 'scripts/prove-installed-catchup.*'
      - 'scripts/fixtures/installed_paths.py'
      - 'scripts/fixtures/native_services.py'
      - 'scripts/fixtures/fleet-baselines.json'
      - 'scripts/fixtures/fleet_baselines.py'
      - 'scripts/fixtures/installed_native.py'
      - 'scripts/fixtures/installed_listener.py'
      - 'scripts/fixtures/installed_listener_evidence.py'
      - 'scripts/fixtures/installed_listener_controls.py'
      - 'scripts/fixtures/installed_adoption.py'
      - 'scripts/fixtures/installed_releases.py'
      - 'scripts/fixtures/installed_origin.py'
      - 'scripts/fixtures/installed_cohort.py'
      - 'scripts/fixtures/installed_chain.py'
      - 'scripts/fixtures/installed_waypoint.py'
      - 'scripts/fixtures/installed_artifacts.py'
      - 'scripts/fixtures/installed_accounts.py'
      - 'scripts/fixtures/installed_order.py'
      - 'scripts/fixtures/installed_order_host.py'
      - 'scripts/fixtures/installed_fresh.py'
      - 'scripts/fixtures/installed_routes.py'
      - 'scripts/fixtures/installed_storage.py'
      - 'scripts/fixtures/installed_publication.py'
      - 'scripts/fixtures/publication_origin.py'
      - 'internal/update/installed_fixture_test.go'
      - 'cmd/mesh/installed_fixture.go'
      - 'scripts/fixtures/native-helper/**'
      - 'scripts/test-installed-catchup.py'

permissions:
  contents: read
  actions: read

env:
  MESH_HARNESS_SOURCE: ${{ inputs.harness_source || github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: installed-catchup-${{ inputs.reusable_call && format('call-{0}-{1}-{2}-{3}', github.run_id, github.workflow, inputs.worker_artifact_run, inputs.worker_artifact_source) || format('pr-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.reusable_call }}

defaults:
  run:
    shell: bash

jobs:
  ordered-manager-domains:
    if: inputs.publication_only != true && (github.event_name != 'pull_request' || inputs.reusable_call || !github.event.pull_request.draft)
    name: Real managers for three disposable hosts
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source || github.event.pull_request.head.sha || github.sha }}
      - name: Prove three isolated native managers before installed order setup
        run: |
          mkdir -p "$RUNNER_TEMP/ordered-managers"
          python3 scripts/fixtures/installed_artifacts.py harness "$MESH_HARNESS_SOURCE" "$RUNNER_TEMP/ordered-managers/harness-source.json"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            env PYTHONPATH="$GITHUB_WORKSPACE/scripts" PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/fixtures/installed_accounts.py "$RUNNER_TEMP/ordered-managers"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-order-manager-domains
          path: ${{ runner.temp }}/ordered-managers
          retention-days: 7

  publication-native:
    if: inputs.release_version != '' || inputs.publication_only
    name: Actual signed draft installation (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            key: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            key: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            key: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source || github.event.pull_request.head.sha || github.sha }}
      - name: Require the main-only publication caller and real native manager
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_SOURCE: ${{ inputs.release_source }}
        run: |
          test -n "$RELEASE_VERSION"
          test -n "$RELEASE_SOURCE"
          test "$GITHUB_REF" = refs/heads/main
          bash scripts/prove-installed-catchup.sh "$RUNNER_TEMP/publication-control"
      - name: Determine actual published updater availability
        id: baseline
        run: |
          value=$(python3 -c 'import json; print(str(json.load(open("scripts/fixtures/fleet-baselines.json"))["firstPublishedUpdater"] is not None).lower())')
          printf 'needed=%s\n' "$value" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: update-publication-trust
          run-id: ${{ inputs.release_run || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publication-trust
      - name: Require retained worker preparation when a real updater baseline exists
        if: steps.baseline.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.worker_artifact_run }}
          PRODUCER_SOURCE: ${{ inputs.worker_artifact_source }}
          MESH_PREPARATION_SOURCE: ${{ inputs.worker_artifact_source }}
          PRODUCER_PREFIX: ${{ inputs.worker_artifact_prefix }}
          ARTIFACT_KEY: ${{ matrix.key }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-worker-input.noindex"
          python3 scripts/fixtures/installed_artifacts.py set "$GITHUB_REPOSITORY" "$PRODUCER_RUN" "$PRODUCER_SOURCE" "$PRODUCER_PREFIX" "$RUNNER_TEMP/publication-control/producer-pin.json"
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_storage.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/publication-control/producer-pin.json" "$ARTIFACT_KEY" "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/publication-control/worker-storage.json"
      - name: Download the exact pinned native worker archive
        if: steps.baseline.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEY: ${{ matrix.key }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_artifacts.py download \
            "$GITHUB_REPOSITORY" "$RUNNER_TEMP/publication-control/producer-pin.json" "$ARTIFACT_KEY" \
            "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/publication-control/worker-download.json"
      - name: Exercise the actual signed draft through native services
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_SOURCE: ${{ inputs.release_source }}
          PRODUCER_SOURCE: ${{ inputs.worker_artifact_source }}
          MESH_PREPARATION_SOURCE: ${{ inputs.worker_artifact_source }}
          HAS_BASELINE: ${{ steps.baseline.outputs.needed }}
          MESH_OWNED_WORKER_INPUT: ${{ runner.temp }}/native-worker-input.noindex
          MESH_PUBLICATION_TRUST_CACHE: ${{ runner.temp }}/publication-trust
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          extra=()
          if [[ $HAS_BASELINE == true ]]; then
            python3 scripts/fixtures/installed_artifacts.py native "$RUNNER_TEMP/native-worker-input.noindex" "$PRODUCER_SOURCE" "$INSTALLED_CATCHUP_PLATFORM"
            chmod +x "$RUNNER_TEMP/native-worker-input.noindex/tools/worker-probe"
            extra=(--worker-registry "$RUNNER_TEMP/native-worker-input.noindex/retained/workers.json" --worker-probe "$RUNNER_TEMP/native-worker-input.noindex/tools/worker-probe")
          fi
          mkdir -p "$RUNNER_TEMP/native-tools.noindex"
          go build -o "$RUNNER_TEMP/native-tools.noindex/native-helper" ./scripts/fixtures/native-helper
          python3 scripts/prove-installed-catchup.py "$RUNNER_TEMP/publication-proof" --native-preflight --native-helper "$RUNNER_TEMP/native-tools.noindex/native-helper" --publication-version "$RELEASE_VERSION" --publication-source "$RELEASE_SOURCE" "${extra[@]}"
      - name: Remove owned publication consumer tools after installed teardown
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/native-tools.noindex" "$RUNNER_TEMP/publication-trust"
          test ! -e "$RUNNER_TEMP/native-worker-input.noindex"
          test ! -e "$RUNNER_TEMP/native-tools.noindex/native-helper"
          test ! -e "$RUNNER_TEMP/publication-trust"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-publication-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/publication-control
            ${{ runner.temp }}/publication-proof
          retention-days: 7

  native-adoption:
    if: inputs.publication_only != true && (github.event_name != 'pull_request' || inputs.reusable_call || !github.event.pull_request.draft)
    name: Installed native adoption (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source || github.event.pull_request.head.sha || github.sha }}
      - name: Prove native manager before builds or downloads
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/installed-catchup"
          git rev-parse HEAD > "$RUNNER_TEMP/installed-catchup/source-sha.txt"
          bash scripts/prove-installed-catchup.sh "$RUNNER_TEMP/installed-catchup"
      - name: Verify path bounds and actual failure cleanup
        env:
          MESH_TEST_NATIVE_MANAGER: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/test-installed-catchup.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build production helper preparation fixture
        run: |
          mkdir -p "$RUNNER_TEMP/native-tools.noindex"
          go build -o "$RUNNER_TEMP/native-tools.noindex/native-helper" ./scripts/fixtures/native-helper
      - name: Adopt actual published native pairs and verify failed activation restoration
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          PYTHONDONTWRITEBYTECODE: '1'
          PAIRED_SCENARIO: ${{ github.workflow == 'Installed catch-up' && 'interrupt' || '' }}
        run: |
          extra=()
          if [[ -n $PAIRED_SCENARIO ]]; then extra=(--scenario "$PAIRED_SCENARIO"); fi
          python3 scripts/prove-installed-catchup.py "$RUNNER_TEMP/installed-catchup/pairs" \
            --native-preflight --installed-adoption --native-helper "$RUNNER_TEMP/native-tools.noindex/native-helper" "${extra[@]}"
      - name: Remove the owned helper preparation tool after installed teardown
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/native-tools.noindex"
          test ! -e "$RUNNER_TEMP/native-tools.noindex/native-helper"
          mkdir -p "$RUNNER_TEMP/installed-catchup"
          printf '{"helperToolAbsent":true}\n' > "$RUNNER_TEMP/installed-catchup/tools-cleanup.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-catchup-${{ strategy.job-index }}
          path: ${{ runner.temp }}/installed-catchup
          retention-days: 7

  fresh-managed:
    if: inputs.publication_only != true && (github.event_name != 'pull_request' || inputs.reusable_call || !github.event.pull_request.draft)
    name: Fresh native automatic first start (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source || github.event.pull_request.head.sha || github.sha }}
      - name: Require the actual native manager before fresh builds or downloads
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/prove-installed-catchup.sh "$RUNNER_TEMP/fresh-control"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare the real helper before the first managed daemon activation
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/prove-installed-catchup.py "$RUNNER_TEMP/fresh-proof" --native-preflight --fresh-managed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-fresh-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/fresh-control
            ${{ runner.temp }}/fresh-proof
          retention-days: 7

  signed-cohort-chain:
    if: inputs.worker_artifact_prefix != '' && ! inputs.publication_only && (github.event_name != 'pull_request' || inputs.reusable_call || !github.event.pull_request.draft)
    name: Signed native cohort (${{ matrix.platform }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/arm64]
        mode: [chain, waypoint, order]
        exclude:
          - platform: linux/arm64
            mode: order
          - platform: darwin/arm64
            mode: order
        include:
          - platform: linux/amd64
            key: linux-amd64
            host: pc
            runner: ubuntu-24.04
          - platform: linux/arm64
            key: linux-arm64
            host: pi
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            key: darwin-arm64
            host: mac
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source || github.event.pull_request.head.sha || github.sha }}
      - name: Require the real native manager before acquisition or builds
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/prove-installed-catchup.sh "$RUNNER_TEMP/cohort-control"
      - name: Require three actual user managers before ordered proof builds
        if: matrix.mode == 'order'
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            env PYTHONPATH="$GITHUB_WORKSPACE/scripts" PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/fixtures/installed_accounts.py "$RUNNER_TEMP/cohort-control/ordered-managers"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the complete pinned producer artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.worker_artifact_run }}
          PRODUCER_SOURCE: ${{ inputs.worker_artifact_source }}
          MESH_PREPARATION_SOURCE: ${{ inputs.worker_artifact_source }}
          PRODUCER_PREFIX: ${{ inputs.worker_artifact_prefix }}
        run: |
          python3 scripts/fixtures/installed_artifacts.py set "$GITHUB_REPOSITORY" "$PRODUCER_RUN" \
            "$PRODUCER_SOURCE" "$PRODUCER_PREFIX" "$RUNNER_TEMP/cohort-control/producer-pin.json"
      - name: Measure actual archive extraction space before large acquisition
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEY: ${{ matrix.key }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-worker-input.noindex"
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_storage.py \
            "$GITHUB_REPOSITORY" "$RUNNER_TEMP/cohort-control/producer-pin.json" "$ARTIFACT_KEY" \
            "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/cohort-control/storage-preflight.json"
      - name: Download the exact pinned native worker archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEY: ${{ matrix.key }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_artifacts.py download \
            "$GITHUB_REPOSITORY" "$RUNNER_TEMP/cohort-control/producer-pin.json" "$ARTIFACT_KEY" \
            "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/cohort-control/worker-download.json"
      - name: Consume exact native registry and once-built observer
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          SOURCE_HOST: ${{ matrix.host }}
          PROOF_MODE: ${{ matrix.mode }}
          PRODUCER_SOURCE: ${{ inputs.worker_artifact_source }}
          MESH_PREPARATION_SOURCE: ${{ inputs.worker_artifact_source }}
          PYTHONDONTWRITEBYTECODE: '1'
          MESH_OWNED_WORKER_INPUT: ${{ runner.temp }}/native-worker-input.noindex
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/native-worker-input.noindex"
          python3 scripts/fixtures/installed_artifacts.py native "$input" "$PRODUCER_SOURCE" "$INSTALLED_CATCHUP_PLATFORM"
          test -s "$input/retained/workers.json"
          chmod +x "$input/tools/worker-probe"
          mkdir -p "$RUNNER_TEMP/native-tools.noindex"
          go build -o "$RUNNER_TEMP/native-tools.noindex/native-helper" ./scripts/fixtures/native-helper
          mode=--signed-chain
          if [[ $PROOF_MODE == waypoint ]]; then mode=--format-waypoint; fi
          if [[ $PROOF_MODE == order ]]; then mode=--ordered-hosts; fi
          python3 scripts/prove-installed-catchup.py "$RUNNER_TEMP/cohort-proof" \
            --native-preflight --installed-adoption --native-helper "$RUNNER_TEMP/native-tools.noindex/native-helper" \
            --worker-registry "$input/retained/workers.json" --worker-probe "$input/tools/worker-probe" \
            --source-host "$SOURCE_HOST" "$mode"
      - name: Remove owned downloaded native inputs and helper tool
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/native-tools.noindex"
          test ! -e "$RUNNER_TEMP/native-worker-input.noindex"
          test ! -e "$RUNNER_TEMP/native-tools.noindex/native-helper"
          mkdir -p "$RUNNER_TEMP/cohort-control"
          printf '{"inputsAbsent":true,"helperToolAbsent":true}\n' > "$RUNNER_TEMP/cohort-control/tools-cleanup.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-cohort-${{ matrix.key }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/cohort-control
            ${{ runner.temp }}/cohort-proof
          retention-days: 7
