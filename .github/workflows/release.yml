name: Publish tested release

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact main commit whose complete CI gate passed
        required: true
        type: string
      version:
        description: Optional explicit stable version for a non-patch release
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested commit on main
        required: true
        type: string
      version:
        description: Optional explicit stable version
        required: false
        type: string

concurrency:
  group: mesh-stable-publication
  queue: max

permissions:
  checks: read
  contents: read

jobs:
  reserve:
    name: Reserve source and version
    permissions:
      checks: read
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ steps.reserve.outputs.action }}
      source: ${{ steps.reserve.outputs.source }}
      version: ${{ steps.reserve.outputs.version }}
      previous_tag: ${{ steps.reserve.outputs.previous_tag }}
      baseline_assets: ${{ steps.reserve.outputs.baseline_assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - id: reserve
        name: Reserve a monotonic release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        # Explicit bash adds pipefail, so a failed reservation fails the step
        # instead of taking tee's status and skipping publication silently.
        shell: bash
        run: scripts/reserve-release.sh "$SOURCE_SHA" "$EXPLICIT_VERSION" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build final artifacts
    permissions:
      contents: write
    needs: reserve
    if: needs.reserve.outputs.action == 'publish'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify final archives
        run: ./scripts/check-packaging.sh dist
      - name: Store final artifacts in the reserved draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          gh release upload "$VERSION" --clobber \
            dist/mesh_darwin_arm64.tar.gz \
            dist/mesh_linux_amd64.tar.gz \
            dist/mesh_linux_arm64.tar.gz \
            dist/checksums.txt \
            dist/homebrew/Casks/mesh.rb

  reconcile-cask:
    name: Reconcile published Cask
    permissions:
      actions: write
      statuses: write
      contents: write
      pull-requests: write
    needs: reserve
    if: needs.reserve.outputs.action == 'reconcile'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - name: Recover the published Cask and finish an interrupted publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
        run: |
          mkdir -p "$RUNNER_TEMP/cask"
          gh release download "$VERSION" --pattern mesh.rb --dir "$RUNNER_TEMP/cask"
          scripts/finalize-release.sh "$VERSION" "$SOURCE" "$VERSION" "$RUNNER_TEMP/cask/mesh.rb"

  prove-transition:
    name: Native forward and rollback proofs
    permissions:
      contents: read
    needs: [reserve, build]
    if: needs.reserve.outputs.action == 'publish'
    uses: ./.github/workflows/update-proofs.yml
    with:
      source_sha: ${{ needs.reserve.outputs.source }}
      version: ${{ needs.reserve.outputs.version }}
      previous_tag: ${{ needs.reserve.outputs.previous_tag }}
      draft: true
      baseline_assets: ${{ needs.reserve.outputs.baseline_assets }}

  publish:
    name: Sign complete release draft
    permissions:
      actions: write
      statuses: write
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: [reserve, build, prove-transition]
    if: needs.reserve.outputs.action == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Recover draft artifacts and proofs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          mkdir -p dist/homebrew/Casks proofs "$RUNNER_TEMP/release-json"
          gh release download "$VERSION" --pattern 'mesh_*.tar.gz' --dir dist
          gh release download "$VERSION" --pattern checksums.txt --dir dist
          gh release download "$VERSION" --pattern mesh.rb --dir dist/homebrew/Casks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: update-proofs-*
          path: ${{ runner.temp }}/proof-shards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: update-policy
          path: ${{ runner.temp }}/mesh-policy
      - name: Collect every native proof asset
        run: python3 scripts/collect-update-proofs.py "$RUNNER_TEMP/proof-shards" proofs "$RUNNER_TEMP/mesh-policy/selection.json" "$(git rev-parse HEAD)"
      - name: Build immutable release manifest
        env:
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
        run: |
          scripts/assemble-release-compatibility.py proofs "$RUNNER_TEMP/compatibility.json"
          scripts/generate-release-manifest.sh \
            -dist dist -version "$VERSION" -commit "$SOURCE" \
            -compatibility "$RUNNER_TEMP/compatibility.json" -proofs proofs \
            -output dist/mesh-release.json
      - name: Build verified update metadata and discovery pages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          MESH_RELEASE_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mesh-policy"
          python3 scripts/acquire-release-history.py "$root/documents" "$HOME/.cache/mesh-release-evidence" "$root/fresh-history.json"
          python3 scripts/stage-release-publication.py "$root" "$VERSION" dist proofs "$RUNNER_TEMP/proof-shards"
          go build -o "$RUNNER_TEMP/mesh-release-sign" ./cmd/mesh-release-sign
          status=75
          while (( status == 75 )); do
            status=0
            "$RUNNER_TEMP/mesh-release-sign" refresh "$MESH_RELEASE_TRUST_CACHE" || status=$?
          done
          (( status == 0 )) || exit "$status"
          go run ./cmd/mesh-release-routes -operation publish -input "$root/input.json" -documents "$root/documents" -output-dir dist | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/stage-metadata-page.py dist "$root/documents" "$RUNNER_TEMP/metadata-page.json"
      - name: Attest final manifest and archives
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/mesh-release.json
            dist/mesh-update.json
            dist/mesh-retention.json
            dist/mesh-workers.json
            dist/mesh-worker-groups.json
            dist/mesh_*.tar.gz
      - name: Verify original bundle and candidate verifier
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          MESH_RELEASE_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
        shell: bash
        run: |
          set -euo pipefail
          for subject in dist/mesh-release.json dist/mesh-update.json dist/mesh-retention.json dist/mesh-workers.json dist/mesh-worker-groups.json dist/mesh_*.tar.gz; do
            gh attestation verify "$subject" --bundle "$BUNDLE" \
              --repo ShaulLavo/mesh \
              --signer-workflow ShaulLavo/mesh/.github/workflows/release.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners
          done
          signer="$RUNNER_TEMP/mesh-release-sign"
          if [[ ! -x $signer ]]; then
            go build -o "$signer" ./cmd/mesh-release-sign
          fi
          status=75
          while (( status == 75 )); do
            status=0
            "$signer" refresh "$MESH_RELEASE_TRUST_CACHE" || status=$?
          done
          (( status == 0 )) || exit "$status"
          "$signer" wrap "$BUNDLE" dist/mesh-update.sig.json \
            dist/mesh-release.json dist/mesh-update.json dist/mesh-retention.json dist/mesh-workers.json dist/mesh-worker-groups.json dist/mesh_*.tar.gz
          "$signer" verify dist/mesh-update.sig.json \
            dist/mesh-release.json dist/mesh-update.json dist/mesh-retention.json dist/mesh-workers.json dist/mesh-worker-groups.json dist/mesh_*.tar.gz
          "$signer" verify-metadata dist/mesh-update.json dist/mesh-update.sig.json dist/mesh-release.json "$RUNNER_TEMP/metadata-page.json"
      - name: Upload signed draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          shopt -s nullglob
          assets=(dist/mesh-release.json dist/mesh-update.json dist/mesh-update-root.json dist/mesh-update.sig.json dist/mesh-retention.json dist/mesh-workers.json dist/mesh-worker-groups.json dist/mesh-anchors-*.json proofs/*.json proofs/rollback/*.rollback.json proofs/groups/leaves/*.worker-group.json)
          gh release upload "$VERSION" --clobber "${assets[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-publication-input
          path: ${{ runner.temp }}/mesh-policy/input.json
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-publication-trust
          path: ${{ runner.temp }}/mesh-release-trust
          retention-days: 7

  verify-readers:
    name: Verify original permitted readers (${{ matrix.platform }})
    needs: [reserve, publish]
    if: needs.reserve.outputs.action == 'publish'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            key: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            key: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            key: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.reserve.outputs.source }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: update-policy
          path: ${{ runner.temp }}/mesh-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: update-publication-input
          path: ${{ runner.temp }}/mesh-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: update-publication-trust
          path: ${{ runner.temp }}/mesh-release-trust
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/mesh-release-baselines
          key: mesh-native-baselines-${{ matrix.key }}-${{ needs.reserve.outputs.version }}
          restore-keys: mesh-native-baselines-${{ matrix.key }}-
      - name: Require the original source verifier to accept each automatic edge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          MESH_RELEASE_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$PLATFORM"
          scratch=$(mktemp -d /tmp/ms-XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch" MESH_SHORT_TMP="$scratch" PYTHONDONTWRITEBYTECODE=1
          root="$RUNNER_TEMP/mesh-policy"
          mkdir -p "$root/documents/$VERSION"
          gh release download "$VERSION" --pattern '*.json' --dir "$root/documents/$VERSION"
          go run ./cmd/mesh-release-routes -operation packets -input "$root/input.json" -documents "$root/documents" -platform "$PLATFORM" -output-dir "$RUNNER_TEMP/reader-packets"
          python3 scripts/run-original-update-readers.py "$RUNNER_TEMP/reader-packets" "$PLATFORM" "$HOME/.cache/mesh-release-baselines" "$MESH_RELEASE_TRUST_CACHE" "$RUNNER_TEMP/reader-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: original-update-readers-${{ matrix.key }}
          path: ${{ runner.temp }}/reader-evidence
          retention-days: 7
      - name: Remove original reader staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mesh-policy" "$RUNNER_TEMP/mesh-release-trust" "$RUNNER_TEMP/reader-packets" "$RUNNER_TEMP/reader-evidence"

  publication-native:
    name: Installed signed draft gate
    needs: [reserve, prove-transition, publish]
    if: needs.reserve.outputs.action == 'publish' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ShaulLavo/mesh/.github/workflows/installed-catchup.yml@7dad1d223f6ece8e85b55073d3fb530e7979e674
    with:
      harness_source: 7dad1d223f6ece8e85b55073d3fb530e7979e674
      publication_only: true
      release_version: ${{ needs.reserve.outputs.version }}
      release_source: ${{ needs.reserve.outputs.source }}
      release_run: ${{ github.run_id }}
      worker_artifact_prefix: update-native
      worker_artifact_run: ${{ fromJSON(needs.prove-transition.outputs.worker_artifact_run) }}
      worker_artifact_source: ${{ needs.prove-transition.outputs.worker_artifact_source }}

  finalize:
    name: Publish verified release
    needs: [reserve, publish, verify-readers, publication-native]
    if: needs.reserve.outputs.action == 'publish' && github.ref == 'refs/heads/main' && needs.verify-readers.result == 'success' && needs.publication-native.result == 'success'
    permissions:
      actions: write
      statuses: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Recover the verified draft Cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/final-cask"
          gh release download "$VERSION" --pattern mesh.rb --dir "$RUNNER_TEMP/final-cask"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installed-publication-*
          path: ${{ runner.temp }}/installed-completion
      - name: Upload and publish after ancestry recheck
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
          PREVIOUS_TAG: ${{ needs.reserve.outputs.previous_tag }}
          MESH_INSTALLED_COMPLETION: ${{ runner.temp }}/installed-completion
        run: |
          scripts/finalize-release.sh "$VERSION" "$SOURCE" "$PREVIOUS_TAG" "$RUNNER_TEMP/final-cask/mesh.rb"
