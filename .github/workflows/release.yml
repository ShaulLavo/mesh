name: Publish tested release

on:
  # Releases happen only when the owner asks for one (2026-11-23): manual
  # dispatch only, with no automatic trigger.
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested commit on main (defaults to the workflow main commit; skips if its main CI is not green)
        required: false
        type: string
      version:
        description: Optional explicit stable version for a non-patch release
        required: false
        type: string

concurrency:
  group: mesh-stable-publication
  queue: max

permissions:
  checks: read
  contents: read

env:
  MESH_PUBLICATION_HARNESS: 156d9c865adf9aaaab09b069c4f4f2e794fbc2e0

jobs:
  reserve:
    name: Reserve source and version
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      checks: read
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ steps.reserve.outputs.action }}
      source: ${{ steps.reserve.outputs.source }}
      version: ${{ steps.reserve.outputs.version }}
      previous_tag: ${{ steps.reserve.outputs.previous_tag }}
      baseline_assets: ${{ steps.reserve.outputs.baseline_assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: reserve
        name: Reserve a monotonic release
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        # Explicit bash adds pipefail, so a failed reservation fails the step
        # instead of taking tee's status and skipping publication silently.
        shell: bash
        run: scripts/reserve-release.sh "$SOURCE_SHA" "$EXPLICIT_VERSION" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build final artifacts
    permissions:
      contents: write
    needs: reserve
    if: needs.reserve.outputs.action == 'publish'
    runs-on: ubuntu-24.04
    outputs:
      candidate-artifact: ${{ steps.candidate-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify final archives
        run: ./scripts/check-packaging.sh dist
      - name: Store final artifacts in the reserved draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          gh release upload "$VERSION" --clobber \
            dist/mesh_darwin_arm64.tar.gz \
            dist/mesh_linux_amd64.tar.gz \
            dist/mesh_linux_arm64.tar.gz \
            dist/checksums.txt \
            dist/homebrew/Casks/mesh.rb
      - name: Capture exact reserved draft archives for read-only proofs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
          BASELINE_ASSETS: ${{ needs.reserve.outputs.baseline_assets }}
        run: python3 scripts/prepare-draft-intake.py capture "$RUNNER_TEMP/release-candidate" "$VERSION" "$SOURCE" --baselines "$BASELINE_ASSETS"
      - id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Remove candidate intake staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-candidate"

  reconcile-cask:
    name: Reconcile published Cask
    permissions:
      actions: write
      statuses: write
      contents: write
      pull-requests: write
    needs: reserve
    if: needs.reserve.outputs.action == 'reconcile'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - name: Recover the published Cask and finish an interrupted publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
        run: |
          mkdir -p "$RUNNER_TEMP/cask"
          gh release download "$VERSION" --pattern mesh.rb --dir "$RUNNER_TEMP/cask"
          scripts/finalize-release.sh "$VERSION" "$SOURCE" "$VERSION" "$RUNNER_TEMP/cask/mesh.rb"

  prove-transition:
    name: Native forward and rollback proofs
    permissions:
      contents: read
    needs: [reserve, build]
    if: needs.reserve.outputs.action == 'publish'
    uses: ./.github/workflows/update-proofs.yml
    with:
      source_sha: ${{ needs.reserve.outputs.source }}
      version: ${{ needs.reserve.outputs.version }}
      previous_tag: ${{ needs.reserve.outputs.previous_tag }}
      draft: true
      baseline_assets: ${{ needs.reserve.outputs.baseline_assets }}
      candidate_artifact: ${{ needs.build.outputs.candidate-artifact }}

  publish:
    name: Sign complete release draft
    permissions:
      actions: write
      statuses: write
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: [reserve, build, prove-transition]
    if: needs.reserve.outputs.action == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      policy-artifact: ${{ needs.prove-transition.outputs.policy_artifact }}
      tool-linux-amd64: ${{ needs.prove-transition.outputs.tool-linux-amd64 }}
      tool-linux-arm64: ${{ needs.prove-transition.outputs.tool-linux-arm64 }}
      tool-darwin-arm64: ${{ needs.prove-transition.outputs.tool-darwin-arm64 }}
      signed-draft-artifact: ${{ steps.signed-draft.outputs.artifact-id }}
      publication-input-artifact: ${{ steps.publication-input.outputs.artifact-id }}
      publication-trust-artifact: ${{ steps.publication-trust.outputs.artifact-id }}
      publication-plan-artifact: ${{ steps.publication-plan-upload.outputs.artifact-id }}
      publication-plan-sha256: ${{ steps.publication-plan.outputs.plan_sha }}
    env:
      MESH_RELEASE_TOOL_SOURCE: ${{ needs.reserve.outputs.source }}
      MESH_RELEASE_TOOL_RUN: ${{ github.run_id }}
      MESH_RELEASE_TOOL_ROLE: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - name: Configure explicit trusted tool paths
        run: |
          echo "MESH_RELEASE_TOOL=$RUNNER_TEMP/release-source-tools/linux-amd64/mesh-release-sign" >> "$GITHUB_ENV"
          echo "MESH_RELEASE_TRUST_CACHE=$RUNNER_TEMP/mesh-release-trust" >> "$GITHUB_ENV"
      - name: Acquire the exact SOURCE tools used by history policy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.prove-transition.outputs.tool-linux-amd64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-source-tools"
          PYTHONPATH=scripts python3 -m fixtures.release_tool download "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$MESH_RELEASE_TOOL_SOURCE" source linux-amd64 "$RUNNER_TEMP/release-source-tools/linux-amd64" "$ARTIFACT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact || '0' }}
          path: ${{ runner.temp }}/release-candidate
      - name: Recover draft artifacts and proofs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
        run: |
          mkdir -p dist/homebrew/Casks proofs
          python3 scripts/prepare-draft-intake.py verify "$RUNNER_TEMP/release-candidate" "$VERSION" "$SOURCE" --run "$GITHUB_RUN_ID"
          cp "$RUNNER_TEMP/release-candidate"/mesh_*.tar.gz "$RUNNER_TEMP/release-candidate/checksums.txt" dist/
          gh release download "$VERSION" --pattern mesh.rb --dir dist/homebrew/Casks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prove-transition.outputs.proof_artifacts || '0' }}
          path: ${{ runner.temp }}/proof-shards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prove-transition.outputs.policy_artifact || '0' }}
          path: ${{ runner.temp }}/mesh-policy
      - name: Recover the manifest exercised by the original reader
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prove-transition.outputs.manifest_artifact || '0' }}
          path: dist
      - name: Collect every native proof asset
        run: python3 scripts/collect-update-proofs.py "$RUNNER_TEMP/proof-shards" proofs "$RUNNER_TEMP/mesh-policy/selection.json" "$(git rev-parse HEAD)"
      - name: Restore same-run verified history bytes for the fresh retention check
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.cache/mesh-release-evidence
          key: ${{ needs.prove-transition.outputs.history_cache_key }}
          restore-keys: mesh-route-evidence-
      - name: Build verified update metadata and discovery pages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          MESH_RELEASE_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mesh-policy"
          status=75
          while (( status == 75 )); do
            status=0
            "$MESH_RELEASE_TOOL" refresh "$MESH_RELEASE_TRUST_CACHE" || status=$?
          done
          (( status == 0 )) || exit "$status"
          python3 scripts/acquire-release-history.py "$root/documents" "$HOME/.cache/mesh-release-evidence" "$root/fresh-history.json"
          python3 scripts/stage-release-publication.py "$root" "$VERSION" dist proofs "$RUNNER_TEMP/proof-shards"
          "$RUNNER_TEMP/release-source-tools/linux-amd64/mesh-release-routes" -operation publish -input "$root/input.json" -documents "$root/documents" -output-dir dist | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/stage-metadata-page.py dist "$root/documents" "$RUNNER_TEMP/metadata-page.json"
      - name: Pack the complete metadata and worker evidence closure
        env:
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
        run: |
          python3 scripts/prepare-release-documents.py "$RUNNER_TEMP/release-candidate" "$VERSION" "$SOURCE" \
            dist proofs "$RUNNER_TEMP/mesh-policy/documents" "$RUNNER_TEMP/mesh-policy/fresh-history.json" \
            "$RUNNER_TEMP/release-bundle" "$GITHUB_RUN_ID"
      - name: Attest final manifest and archives
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/mesh-release.json
            dist/mesh-update.json
            dist/mesh-retention.json
            dist/mesh-workers.json
            dist/mesh-worker-groups.json
            dist/mesh-documents.tar.gz
            dist/mesh_*.tar.gz
      - name: Verify original bundle and candidate verifier
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          MESH_RELEASE_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
        shell: bash
        run: |
          set -euo pipefail
          for subject in dist/mesh-release.json dist/mesh-update.json dist/mesh-retention.json dist/mesh-workers.json dist/mesh-worker-groups.json dist/mesh-documents.tar.gz dist/mesh_*.tar.gz; do
            gh attestation verify "$subject" --bundle "$BUNDLE" \
              --repo ShaulLavo/mesh \
              --signer-workflow ShaulLavo/mesh/.github/workflows/release.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners
          done
          signer="$MESH_RELEASE_TOOL"
          status=75
          while (( status == 75 )); do
            status=0
            "$signer" refresh "$MESH_RELEASE_TRUST_CACHE" || status=$?
          done
          (( status == 0 )) || exit "$status"
          "$signer" wrap "$BUNDLE" dist/mesh-update.sig.json \
            dist/mesh-release.json dist/mesh-update.json dist/mesh-retention.json dist/mesh-workers.json dist/mesh-worker-groups.json dist/mesh-documents.tar.gz dist/mesh_*.tar.gz
          "$signer" verify dist/mesh-update.sig.json \
            dist/mesh-release.json dist/mesh-update.json dist/mesh-retention.json dist/mesh-workers.json dist/mesh-worker-groups.json dist/mesh-documents.tar.gz dist/mesh_*.tar.gz
          "$signer" verify-metadata dist/mesh-update.json dist/mesh-update.sig.json dist/mesh-release.json "$RUNNER_TEMP/metadata-page.json"
      - name: Upload signed draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
        run: |
          python3 scripts/upload-signed-draft.py "$RUNNER_TEMP/release-candidate" "$VERSION" "$SOURCE" "$RUNNER_TEMP/release-bundle/uploads.json"
      - name: Capture actual signed draft for read-only publication consumers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
          BASELINE_ASSETS: ${{ needs.reserve.outputs.baseline_assets }}
        run: python3 scripts/prepare-draft-intake.py capture "$RUNNER_TEMP/release-signed-draft" "$VERSION" "$SOURCE" --signed --candidate "$RUNNER_TEMP/release-candidate" --baselines "$BASELINE_ASSETS"
      - name: Authenticate the actual captured bundle and complete semantic closure
        env:
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
        run: python3 scripts/prepare-draft-intake.py documents "$RUNNER_TEMP/release-signed-draft" "$VERSION" "$SOURCE" --run "$GITHUB_RUN_ID" --destination "$RUNNER_TEMP/release-captured-logical"
      - id: publication-plan
        name: Derive exact three-platform signed draft verification plan
        env:
          VERSION: ${{ needs.reserve.outputs.version }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/mesh-policy/documents" "$RUNNER_TEMP/plan-documents"
          rm -rf -- "$RUNNER_TEMP/plan-documents/$VERSION"
          cp -R "$RUNNER_TEMP/release-captured-logical" "$RUNNER_TEMP/plan-documents/$VERSION"
          mkdir -p "$RUNNER_TEMP/reader-packets" "$RUNNER_TEMP/publication-plan"
          for native in linux/amd64 linux/arm64 darwin/arm64; do
            key=${native//\//-}
            "$RUNNER_TEMP/release-source-tools/linux-amd64/mesh-release-routes" -operation packets \
              -input "$RUNNER_TEMP/mesh-policy/input.json" \
              -documents "$RUNNER_TEMP/plan-documents" \
              -platform "$native" \
              -output-dir "$RUNNER_TEMP/reader-packets/$key"
          done
          plan_sha=$(python3 scripts/publication-jobs.py reduced-plan \
            "$RUNNER_TEMP/release-captured-logical" \
            "$RUNNER_TEMP/release-signed-draft" \
            "$MESH_PUBLICATION_HARNESS" \
            "$RUNNER_TEMP/reader-packets" \
            "$RUNNER_TEMP/publication-plan/plan.json")
          printf 'plan_sha=%s\n' "$plan_sha" >> "$GITHUB_OUTPUT"
      - id: publication-plan-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-plan-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-plan/plan.json
          if-no-files-found: error
          retention-days: 7
      - id: signed-draft
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-draft
          path: ${{ runner.temp }}/release-signed-draft
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - id: publication-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-publication-input
          path: ${{ runner.temp }}/mesh-policy/input.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - id: publication-trust
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-publication-trust
          path: ${{ runner.temp }}/mesh-release-trust
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Remove signed draft intake staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-signed-draft" "$RUNNER_TEMP/release-candidate" "$RUNNER_TEMP/release-source-tools" "$RUNNER_TEMP/release-bundle" "$RUNNER_TEMP/release-captured-logical" "$RUNNER_TEMP/release-captured-logical.logical-inventory.json" "$RUNNER_TEMP/mesh-policy" "$RUNNER_TEMP/mesh-release-trust" "$RUNNER_TEMP/proof-shards" "$RUNNER_TEMP/metadata-page.json" "$RUNNER_TEMP/plan-documents" "$RUNNER_TEMP/reader-packets" "$RUNNER_TEMP/publication-plan"

  publication-native:
    name: Installed signed draft and reader gate (${{ matrix.platform }})
    needs: [reserve, prove-transition, publish]
    if: needs.reserve.outputs.action == 'publish' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    timeout-minutes: 75
    outputs:
      linux-amd64: ${{ job.status == 'success' && matrix.platform == 'linux/amd64' && steps.handoff.outputs.pin || '' }}
      linux-arm64: ${{ job.status == 'success' && matrix.platform == 'linux/arm64' && steps.handoff.outputs.pin || '' }}
      darwin-arm64: ${{ job.status == 'success' && matrix.platform == 'darwin/arm64' && steps.handoff.outputs.pin || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            key: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            key: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            key: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MESH_PUBLICATION_HARNESS }}
          persist-credentials: false
      - uses: ./.github/actions/installed-go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-plan-artifact || '0' }}
          path: ${{ runner.temp }}/publication-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.policy-artifact || '0' }}
          path: ${{ runner.temp }}/mesh-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-input-artifact || '0' }}
          path: ${{ runner.temp }}/mesh-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-trust-artifact || '0' }}
          path: ${{ runner.temp }}/mesh-release-trust
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/mesh-release-baselines
          key: mesh-native-baselines-${{ matrix.key }}-${{ needs.reserve.outputs.version }}
          restore-keys: mesh-native-baselines-${{ matrix.key }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.signed-draft-artifact || '0' }}
          path: ${{ runner.temp }}/publication-draft-input/${{ needs.reserve.outputs.version }}
      - name: Acquire the exact same-run SOURCE release tool
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ matrix.key }}
          MESH_RELEASE_TOOL_SOURCE: ${{ needs.reserve.outputs.source }}
          MESH_RELEASE_TOOL_RUN: ${{ github.run_id }}
          MESH_RELEASE_TOOL_ROLE: source
          ARTIFACT: ${{ needs.publish.outputs[format('tool-{0}', matrix.key)] }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 -m fixtures.release_tool download "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$MESH_RELEASE_TOOL_SOURCE" source "$KEY" "$RUNNER_TEMP/release-source-tools" "$ARTIFACT"
      - name: Generate native SOURCE reader packets for the signed draft
        env:
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
          PLATFORM: ${{ matrix.platform }}
          KEY: ${{ matrix.key }}
          MESH_RELEASE_TOOL: ${{ runner.temp }}/release-source-tools/mesh-release-sign
          MESH_RELEASE_TOOL_SOURCE: ${{ needs.reserve.outputs.source }}
          MESH_RELEASE_TOOL_RUN: ${{ github.run_id }}
          MESH_RELEASE_TOOL_ROLE: source
          MESH_RELEASE_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
        shell: bash
        run: |
          set -euo pipefail
          test "$(PYTHONPATH=scripts python3 -c 'from fixtures.release_tool import native_target; p=native_target(); print(p["os"]+"/"+p["arch"])')" = "$PLATFORM"
          root="$RUNNER_TEMP/mesh-policy"
          python3 scripts/publication-workflow.py draft "$VERSION" "$SOURCE" "$root/documents/$VERSION" --intake "$RUNNER_TEMP/publication-draft-input/$VERSION" --run "$GITHUB_RUN_ID"
          mkdir -p "$RUNNER_TEMP/reader-packets/$KEY"
          "$RUNNER_TEMP/release-source-tools/mesh-release-routes" -operation packets \
            -input "$root/input.json" \
            -documents "$root/documents" \
            -platform "$PLATFORM" \
            -output-dir "$RUNNER_TEMP/reader-packets/$KEY"
      - name: Build reviewed immutable harness verifier and native helper
        env:
          PLATFORM: ${{ matrix.platform }}
          MESH_HARNESS_SOURCE: ${{ env.MESH_PUBLICATION_HARNESS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MESH_HARNESS_SOURCE"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/harness.noindex"
          go build -trimpath -o "$RUNNER_TEMP/harness.noindex/mesh-release-sign" ./cmd/mesh-release-sign
          go build -trimpath -o "$RUNNER_TEMP/harness.noindex/native-helper" ./scripts/fixtures/native-helper
          go test -c -tags mesh_installed_fixture -o "$RUNNER_TEMP/harness.noindex/publication-reader" ./internal/update
          PYTHONPATH=scripts python3 -m fixtures.release_tool record "$RUNNER_TEMP/harness.noindex" "$MESH_HARNESS_SOURCE" "$GITHUB_RUN_ID" harness "$PLATFORM"
      - name: Determine actual published updater availability
        id: baseline
        run: |
          value=$(python3 -c 'import json; print(str(json.load(open("scripts/fixtures/fleet-baselines.json"))["firstPublishedUpdater"] is not None).lower())')
          printf 'needed=%s\n' "$value" >> "$GITHUB_OUTPUT"
      - name: Require and acquire the exact pinned same-run native worker archive
        if: steps.baseline.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ needs.prove-transition.outputs.worker_artifact_run }}
          PRODUCER_SOURCE: ${{ needs.prove-transition.outputs.worker_artifact_source }}
          MESH_PREPARATION_SOURCE: ${{ needs.prove-transition.outputs.worker_artifact_source }}
          PRODUCER_PREFIX: update-native
          ARTIFACT_KEY: ${{ matrix.key }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/publication-control"
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_artifacts.py set \
            "$GITHUB_REPOSITORY" "$PRODUCER_RUN" "$PRODUCER_SOURCE" "$PRODUCER_PREFIX" "$RUNNER_TEMP/publication-control/producer-pin.json"
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_storage.py \
            "$GITHUB_REPOSITORY" "$RUNNER_TEMP/publication-control/producer-pin.json" "$ARTIFACT_KEY" \
            "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/publication-control/worker-storage.json"
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_artifacts.py download \
            "$GITHUB_REPOSITORY" "$RUNNER_TEMP/publication-control/producer-pin.json" "$ARTIFACT_KEY" \
            "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/publication-control/worker-download.json"
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 scripts/fixtures/installed_artifacts.py native \
            "$RUNNER_TEMP/native-worker-input.noindex" "$PRODUCER_SOURCE" "$PLATFORM"
          chmod +x "$RUNNER_TEMP/native-worker-input.noindex/tools/worker-probe"
      - name: Exercise signed draft native cases, original permitted readers, and record evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
          PLATFORM: ${{ matrix.platform }}
          KEY: ${{ matrix.key }}
          HAS_BASELINE: ${{ steps.baseline.outputs.needed }}
          PRODUCER_SOURCE: ${{ needs.prove-transition.outputs.worker_artifact_source }}
          MESH_PREPARATION_SOURCE: ${{ needs.prove-transition.outputs.worker_artifact_source }}
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          MESH_HARNESS_SOURCE: ${{ env.MESH_PUBLICATION_HARNESS }}
          PUBLICATION_PLAN: ${{ runner.temp }}/publication-plan/plan.json
          PLAN_SHA: ${{ needs.publish.outputs.publication-plan-sha256 }}
          MESH_RELEASE_TOOL: ${{ runner.temp }}/harness.noindex/mesh-release-sign
          MESH_RELEASE_TOOL_SOURCE: ${{ env.MESH_PUBLICATION_HARNESS }}
          MESH_RELEASE_TOOL_RUN: ${{ github.run_id }}
          MESH_RELEASE_TOOL_ROLE: harness
          MESH_RELEASE_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
          MESH_PUBLICATION_TRUST_CACHE: ${{ runner.temp }}/mesh-release-trust
          MESH_PUBLICATION_DRAFT: ${{ runner.temp }}/publication-draft-input/${{ needs.reserve.outputs.version }}
          MESH_PUBLICATION_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/publication-evidence"
          plan=(--publication-platform-plan "$PUBLICATION_PLAN" --publication-plan-sha256 "$PLAN_SHA")
          extra=()
          if [[ $HAS_BASELINE == true ]]; then
            extra=(--worker-registry "$RUNNER_TEMP/native-worker-input.noindex/retained/workers.json" --worker-probe "$RUNNER_TEMP/native-worker-input.noindex/tools/worker-probe")
          fi
          python3 scripts/prove-installed-catchup.py "$output" --native-preflight \
            --native-helper "$RUNNER_TEMP/harness.noindex/native-helper" \
            --publication-version "$VERSION" --publication-source "$SOURCE" \
            "${extra[@]}" "${plan[@]}"
          scratch=$(mktemp -d /tmp/ms-XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          TMPDIR="$scratch" MESH_SHORT_TMP="$scratch" python3 scripts/run-original-update-readers.py \
            "$RUNNER_TEMP/reader-packets/$KEY" "$PLATFORM" \
            "$HOME/.cache/mesh-release-baselines" "$MESH_RELEASE_TRUST_CACHE" "$output/readers" "${plan[@]}"
          python3 scripts/publication-jobs.py record-platform "$output" "$PLATFORM" "$PUBLICATION_PLAN" "$PLAN_SHA"
      - name: Remove publication staging inputs and confirm removal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/publication-plan" "$RUNNER_TEMP/mesh-policy" "$RUNNER_TEMP/mesh-release-trust" \
            "$RUNNER_TEMP/publication-draft-input" "$RUNNER_TEMP/release-source-tools" "$RUNNER_TEMP/reader-packets" \
            "$RUNNER_TEMP/harness.noindex" "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/publication-control"
          for path in publication-plan mesh-policy mesh-release-trust publication-draft-input release-source-tools reader-packets harness.noindex native-worker-input.noindex publication-control; do
            test ! -e "$RUNNER_TEMP/$path"
          done
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publication-platform-${{ matrix.key }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-evidence
          retention-days: 7
      - id: handoff
        name: Hand off only successful native evidence
        env:
          ARTIFACT: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/publication-evidence/publication-platform.json"
          test -n "$ARTIFACT"
          printf 'pin=%s:%s\n' "$ARTIFACT" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Remove uploaded native evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/publication-evidence"
          test ! -e "$RUNNER_TEMP/publication-evidence"

  finalize:
    name: Publish verified release
    needs: [reserve, publish, publication-native]
    if: needs.reserve.outputs.action == 'publish' && github.ref == 'refs/heads/main' && needs.publication-native.result == 'success'
    permissions:
      actions: write
      statuses: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    env:
      MESH_RELEASE_TOOL_SOURCE: ${{ needs.reserve.outputs.source }}
      MESH_RELEASE_TOOL_RUN: ${{ github.run_id }}
      MESH_RELEASE_TOOL_ROLE: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.reserve.outputs.source }}
      - name: Configure explicit trusted tool paths
        run: |
          echo "MESH_RELEASE_TOOL=$RUNNER_TEMP/release-source-tools/mesh-release-sign" >> "$GITHUB_ENV"
          echo "MESH_RELEASE_TRUST_CACHE=$RUNNER_TEMP/mesh-release-trust" >> "$GITHUB_ENV"
      - name: Acquire the exact same-run SOURCE release tool
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.publish.outputs['tool-linux-amd64'] }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 -m fixtures.release_tool download "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$MESH_RELEASE_TOOL_SOURCE" source linux-amd64 "$RUNNER_TEMP/release-source-tools" "$ARTIFACT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-plan-artifact || '0' }}
          path: ${{ runner.temp }}/publication-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-trust-artifact || '0' }}
          path: ${{ runner.temp }}/mesh-release-trust
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.signed-draft-artifact || '0' }}
          path: ${{ runner.temp }}/release-signed-draft
      - name: Recover the verified draft Cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/final-cask"
          gh release download "$VERSION" --pattern mesh.rb --dir "$RUNNER_TEMP/final-cask"
      - id: platform-evidence
        name: Acquire exact same-run three-platform publication evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          EVIDENCE_HANDOFF: ${{ format('{{"linux/amd64":"{0}","linux/arm64":"{1}","darwin/arm64":"{2}"}}', needs.publication-native.outputs.linux-amd64, needs.publication-native.outputs.linux-arm64, needs.publication-native.outputs.darwin-arm64) }}
        shell: bash
        run: |
          set -euo pipefail
          attempts=$(python3 scripts/publication-workflow.py fetch-platforms \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$EVIDENCE_HANDOFF" "$RUNNER_TEMP/installed-completion")
          printf 'attempts=%s\n' "$attempts" >> "$GITHUB_OUTPUT"
      - name: Upload and publish after ancestry recheck
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.reserve.outputs.version }}
          SOURCE: ${{ needs.reserve.outputs.source }}
          PREVIOUS_TAG: ${{ needs.reserve.outputs.previous_tag }}
          MESH_PUBLICATION_DRAFT: ${{ runner.temp }}/release-signed-draft
          MESH_INSTALLED_COMPLETION: ${{ runner.temp }}/installed-completion
          MESH_PUBLICATION_PLAN: ${{ runner.temp }}/publication-plan/plan.json
          MESH_PUBLICATION_PLAN_SHA256: ${{ needs.publish.outputs.publication-plan-sha256 }}
          MESH_PUBLICATION_ATTEMPTS: ${{ steps.platform-evidence.outputs.attempts }}
        run: |
          scripts/finalize-release.sh "$VERSION" "$SOURCE" "$PREVIOUS_TAG" "$RUNNER_TEMP/final-cask/mesh.rb"
      - name: Remove finalization snapshot and tools
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-source-tools" "$RUNNER_TEMP/mesh-release-trust" "$RUNNER_TEMP/release-signed-draft" "$RUNNER_TEMP/publication-plan" "$RUNNER_TEMP/installed-completion" "$RUNNER_TEMP/final-cask"
