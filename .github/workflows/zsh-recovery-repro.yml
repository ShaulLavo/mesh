name: Temporary zsh recovery reproduction
on:
  push:
    branches: [fix/shell-recovery-zsh]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Inspect global zsh startup
        run: |
          cat /etc/zsh/zshenv /etc/zsh/zshrc
          stat -c '%a %U:%G %n' /usr/local/share /usr/local/share/zsh /usr/local/share/zsh/site-functions
      - run: go build -o "$RUNNER_TEMP/mesh" ./cmd/mesh
      - name: Reproduce and compare shell environments
        run: |
          set -o pipefail
          env -u ANTHROPIC_BASE_URL -u ANTHROPIC_API_KEY -u OPENAI_BASE_URL -u OPENAI_API_KEY python3 .github/zsh-recovery-probe.py "$RUNNER_TEMP/mesh" 2>&1 | tee "$RUNNER_TEMP/zsh-reproduction.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zsh-reproduction
          path: ${{ runner.temp }}/zsh-reproduction.log
          retention-days: 7
