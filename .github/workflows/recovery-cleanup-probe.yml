name: Recovery cleanup probe
on:
  push:
    branches: [fix/recovery-history-cleanup]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "$RUNNER_TEMP/mesh" ./cmd/mesh
      - run: sudo apt-get update -qq && sudo apt-get install -y strace
      - name: Normal CI shell before and after cleanup loops
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          cp integration/helpers/terminal_window.py "$RUNNER_TEMP/terminal-window-fixed.py"
          git show 9b19c48:integration/helpers/terminal_window.py > "$RUNNER_TEMP/terminal-window-before.py"
          trap 'cp "$RUNNER_TEMP/terminal-window-fixed.py" integration/helpers/terminal_window.py' EXIT
          cat > "$RUNNER_TEMP/cleanup-probe.py" <<'PY'
          import os
          from pathlib import Path
          import runpy
          import subprocess
          import sys
          sys.dont_write_bytecode = True
          original = os.rmdir
          def diagnostic_rmdir(path, *, dir_fd=None):
              try:
                  return original(path, dir_fd=dir_fd)
              except OSError as error:
                  target = Path(os.readlink(f'/proc/self/fd/{dir_fd}')) / path if dir_fd is not None else Path(path)
                  print(f'CLEANUP ERROR: {error}; path={target}', flush=True)
                  for entry in target.rglob('*'):
                      print(f'REMAINING: {entry}', flush=True)
                      if entry.is_file() and entry.name.endswith('.json'):
                          print(entry.read_text(), flush=True)
                  print(subprocess.check_output(['ps', '-eo', 'pid,ppid,stat,args']).decode(), flush=True)
                  raise
          os.rmdir = diagnostic_rmdir
          sys.path.insert(0, str(Path('integration/helpers').resolve()))
          case, binary = sys.argv[1:]
          if case == 'window_entry':
              sys.argv = ['integration/helpers/terminal_window.py', 'window-entry', binary]
          else:
              sys.argv = ['integration/helpers/shell_recovery.py', binary]
          runpy.run_path(sys.argv[0], run_name='__main__')
          PY
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          root = Path(os.environ['RUNNER_TEMP'])
          failed_after = False
          for phase in ('before', 'fixed'):
              shutil.copyfile(root / f'terminal-window-{phase}.py', 'integration/helpers/terminal_window.py')
              for case in ('shell_recovery',):
                  def trial(number):
                      log = root / 'recovery-evidence' / f'{phase}-{case}-{number}.log'
                      with log.open('w') as output:
                          result = subprocess.run(['strace', '-f', '-e', 'trace=renameat,openat,unlinkat,rmdir,kill,exit_group',
                                                   '-e', 'inject=renameat:delay_enter=20ms',
                                                   '-e', 'inject=rmdir:delay_enter=50ms', '-o', str(log) + '.trace',
                                                   sys.executable, str(root / 'cleanup-probe.py'), case, str(root / 'mesh')],
                                                  stdout=output, stderr=subprocess.STDOUT)
                      return number, result.returncode, log
                  failures = cleanup_failures = 0
                  with ThreadPoolExecutor(max_workers=6) as pool:
                      for number, code, log in pool.map(trial, range(1, 31)):
                          print(f'{phase.upper()} {case} TRIAL {number} {"FAIL" if code else "PASS"}', flush=True)
                          if code:
                              failures += 1
                              contents = log.read_text()
                              cleanup_failures += 'Directory not empty' in contents
                              print(contents, flush=True)
                  print(f'{phase.upper()} {case} FAILURES: {failures}/30; ENOTEMPTY: {cleanup_failures}/30', flush=True)
                  failed_after |= phase == 'fixed' and bool(failures)
          sys.exit(failed_after)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: expanded-cleanup-evidence
          path: ${{ runner.temp }}/recovery-evidence
