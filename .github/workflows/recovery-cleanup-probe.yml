name: Recovery cleanup probe
on:
  push:
    branches: [fix/recovery-history-cleanup]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "$RUNNER_TEMP/mesh" ./cmd/mesh
      - run: command -v strace || (sudo apt-get update -qq && sudo apt-get install -y strace)
      - name: Regression negative control
        run: |
          fixed="$RUNNER_TEMP/terminal-window-fixed.py"
          cp integration/helpers/terminal_window.py "$fixed"
          trap 'cp "$fixed" integration/helpers/terminal_window.py' EXIT
          git show 9b19c48:integration/helpers/terminal_window.py > integration/helpers/terminal_window.py
          if MESH="$RUNNER_TEMP/mesh" bash integration/fixture_cleanup.sh > "$RUNNER_TEMP/negative-control.log" 2>&1; then
            echo 'FAIL: unfixed teardown passed the regression'
            exit 1
          fi
          cat "$RUNNER_TEMP/negative-control.log"
          grep -F 'fixture.close returned while its worker was suspended' "$RUNNER_TEMP/negative-control.log"
      - name: Fixture shutdown regression
        run: MESH="$RUNNER_TEMP/mesh" bash integration/fixture_cleanup.sh
      - name: Never-attached regression negative control
        run: |
          fixed="$RUNNER_TEMP/terminal-window-fixed.py"
          cp integration/helpers/terminal_window.py "$fixed"
          trap 'cp "$fixed" integration/helpers/terminal_window.py' EXIT
          git show dee43df:integration/helpers/terminal_window.py > integration/helpers/terminal_window.py
          if "$RUNNER_TEMP/mesh" version >/dev/null && python3 - "$RUNNER_TEMP/mesh" > "$RUNNER_TEMP/never-attached-negative.log" 2>&1 <<'PYTHON'
          import sys
          import tempfile
          sys.path.insert(0, 'integration/helpers')
          from fixture_cleanup import exercise_unattached
          with tempfile.TemporaryDirectory(prefix='mesh-unattached-negative-') as root:
              exercise_unattached(sys.argv[1], root)
          PYTHON
          then
            echo 'FAIL: unacknowledged kill passed the never-attached regression'
            exit 1
          fi
          cat "$RUNNER_TEMP/never-attached-negative.log"
          grep -F 'fixture workers did not finish writing their session data' "$RUNNER_TEMP/never-attached-negative.log"
      - name: Agent and hibernation teardown
        run: |
          MESH="$RUNNER_TEMP/mesh" bash integration/agent_recovery.sh
          MESH="$RUNNER_TEMP/mesh" bash integration/hibernation.sh
      - name: Ten revised branch SSH resize trials
        run: |
          failures=0
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          for number in $(seq 1 10); do
            if MESH="$RUNNER_TEMP/mesh" bash integration/ssh_sessions.sh > "$RUNNER_TEMP/recovery-evidence/branch-ssh-$number.log" 2>&1; then
              echo "BRANCH SSH TRIAL $number PASS"
            else
              failures=$((failures + 1))
              echo "BRANCH SSH TRIAL $number FAIL"
              cat "$RUNNER_TEMP/recovery-evidence/branch-ssh-$number.log"
            fi
          done
          echo "BRANCH SSH FAILURES: $failures/10"
          test "$failures" = 0
      - name: Run thirty recovery cleanup trials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          cat > "$RUNNER_TEMP/recovery-probe.py" <<'PY'
          import os
          from pathlib import Path
          import runpy
          import subprocess
          import sys
          sys.dont_write_bytecode = True
          original = os.rmdir
          def diagnostic_rmdir(path, *, dir_fd=None):
              try:
                  return original(path, dir_fd=dir_fd)
              except OSError as error:
                  if dir_fd is not None:
                      target = Path(os.readlink(f'/proc/self/fd/{dir_fd}')) / path
                  else:
                      target = Path(path)
                  print(f'CLEANUP ERROR: {error}; path={target}', flush=True)
                  for entry in target.rglob('*'):
                      print(f'REMAINING: {entry}', flush=True)
                      if entry.is_file() and entry.name.endswith('.json'):
                          print(entry.read_text(), flush=True)
                  print(subprocess.check_output(['ps', '-eo', 'pid,ppid,stat,args']).decode(), flush=True)
                  raise
          os.rmdir = diagnostic_rmdir
          sys.path.insert(0, str(Path('integration/helpers').resolve()))
          sys.argv = ['integration/helpers/recovery_history.py', sys.argv[1]]
          runpy.run_path(sys.argv[0], run_name='__main__')
          PY
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path(os.environ['RUNNER_TEMP'])
          def trial(number):
              log = root / 'recovery-evidence' / f'trial-{number}.log'
              with log.open('w') as output:
                  result = subprocess.run(['strace', '-f', '-e', 'trace=renameat,openat,unlinkat,rmdir,kill,exit_group',
                                           '-e', 'inject=renameat:delay_enter=20ms',
                                           '-e', 'inject=rmdir:delay_enter=50ms', '-o', str(log) + '.trace',
                                           sys.executable, str(root / 'recovery-probe.py'), str(root / 'mesh')],
                                          stdout=output, stderr=subprocess.STDOUT)
              return number, result.returncode, log
          failures = 0
          with ThreadPoolExecutor(max_workers=6) as pool:
              for number, code, log in pool.map(trial, range(1, 31)):
                  print(f'TRIAL {number} {"FAIL" if code else "PASS"}', flush=True)
                  if code:
                      failures += 1
                      print(log.read_text(), flush=True)
          print(f'RECOVERY CLEANUP FAILURES: {failures}/30', flush=True)
          sys.exit(bool(failures))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-cleanup-evidence
          path: ${{ runner.temp }}/recovery-evidence
