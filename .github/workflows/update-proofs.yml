name: Native release transition proofs

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        default: ''
        type: string
      previous_tag:
        default: ''
        type: string
      draft:
        default: false
        type: boolean
      baseline_assets:
        default: ''
        type: string
      candidate_artifact:
        default: ''
        type: string

    outputs:
      worker_artifact_source:
        description: Clean checkout source used by all three native preparations
        value: ${{ jobs.context.outputs.source }}
      worker_artifact_run:
        description: This run containing the complete native preparation artifacts
        value: ${{ jobs.context.outputs.run }}
      policy_artifact:
        value: ${{ jobs.policy.outputs.artifact }}
      history_cache_key:
        value: ${{ jobs.policy.outputs.history_cache_key }}
      proof_artifacts:
        value: ${{ jobs.reader.outputs.proof_artifacts }}
      manifest_artifact:
        value: ${{ jobs.reader.outputs.manifest_artifact }}
      tool-linux-amd64:
        value: ${{ jobs.policy.outputs.tool-linux-amd64 }}
      tool-linux-arm64:
        value: ${{ jobs.prepare.outputs.tool-linux-arm64 }}
      tool-darwin-arm64:
        value: ${{ jobs.prepare.outputs.tool-darwin-arm64 }}

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      MESH_RELEASE_TOOL_SOURCE: ${{ inputs.source_sha }}
      MESH_RELEASE_TOOL_RUN: ${{ github.run_id }}
      MESH_RELEASE_TOOL_ROLE: source
    outputs:
      version: ${{ steps.select.outputs.version }}
      previous: ${{ steps.select.outputs.previous }}
      shards: ${{ steps.select.outputs.shards }}
      prove: ${{ steps.select.outputs.prove }}
      artifact: ${{ steps.policy-upload.outputs.artifact-id }}
      history_cache_key: mesh-route-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      tool-linux-amd64: ${{ steps.tool-linux-amd64.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/mesh-release-evidence
          key: mesh-route-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mesh-route-evidence-
      - name: Prepare the explicit SOURCE metadata and route tools
        run: |
          scripts/build-source-release-tools.sh "$RUNNER_TEMP/history-tools" linux/amd64
          echo "MESH_RELEASE_TOOL=$RUNNER_TEMP/history-tools/linux-amd64/mesh-release-sign" >> "$GITHUB_ENV"
          echo "MESH_RELEASE_TRUST_CACHE=$RUNNER_TEMP/history-trust" >> "$GITHUB_ENV"
      - name: Prepare authenticated trust before reading signed history
        run: |
          status=75
          for _ in 1 2 3 4; do
            status=0
            "$MESH_RELEASE_TOOL" refresh "$MESH_RELEASE_TRUST_CACHE" || status=$?
            if (( status != 75 )); then break; fi
          done
          (( status == 0 )) || exit "$status"
      - name: Freeze required source selection from verified receipt bytes
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ inputs.previous_tag }}
          DRAFT: ${{ inputs.draft }}
          BASELINE_ASSETS: ${{ inputs.baseline_assets }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-record-update-preparation.py
          root="$RUNNER_TEMP/mesh-policy"
          mkdir -p "$root/documents"
          python3 scripts/acquire-release-history.py "$root/documents" "$HOME/.cache/mesh-release-evidence" "$root/history.json"
          if [[ -z $PREVIOUS ]]; then
            PREVIOUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[-1]["tag"])' "$root/history.json")
          fi
          if [[ -z $VERSION ]]; then
            VERSION=$(python3 -c 'import sys; v=sys.argv[1].split("."); v[-1]=str(int(v[-1])+1); print(".".join(v))' "$PREVIOUS")
          fi
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/prepare-release-policy.py "$root/history.json" "$root/documents" "$VERSION" "$published_at" "$root/input.json"
          "${MESH_RELEASE_TOOL%/*}/mesh-release-routes" -operation select -input "$root/input.json" -documents "$root/documents" > "$root/selection.json"
          python3 scripts/prepare-release-baselines.py --pins "$root/selection.json" "$BASELINE_ASSETS"
          printf 'version=%s\nprevious=%s\n' "$VERSION" "$PREVIOUS" >> "$GITHUB_OUTPUT"
          shards=$(python3 scripts/prepare-release-baselines.py --shards "$root/selection.json" "$BASELINE_ASSETS")
          matrix=$(python3 scripts/prepare-release-baselines.py --prove-matrix "$shards" "$DRAFT")
          if [[ $DRAFT == true ]]; then
            shards=$(python3 -c 'import json,sys; print(json.dumps(sorted({row["shard"] for row in json.loads(sys.argv[1])["include"]})))' "$matrix")
          fi
          printf 'shards=%s\n' "$shards" >> "$GITHUB_OUTPUT"
          printf 'prove=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - id: policy-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-policy
          path: ${{ runner.temp }}/mesh-policy
          retention-days: 7
          overwrite: ${{ inputs.draft }}
          if-no-files-found: error
      - id: tool-linux-amd64
        if: inputs.draft
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tool-source-linux-amd64
          path: ${{ runner.temp }}/history-tools/linux-amd64
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Remove policy staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mesh-policy" "$RUNNER_TEMP/history-tools" "$RUNNER_TEMP/history-trust"

  prepare:
    needs: policy
    outputs:
      native-linux-amd64: ${{ matrix.key == 'linux-amd64' && steps.native-upload.outputs.artifact-id || '' }}
      native-linux-arm64: ${{ matrix.key == 'linux-arm64' && steps.native-upload.outputs.artifact-id || '' }}
      native-darwin-arm64: ${{ matrix.key == 'darwin-arm64' && steps.native-upload.outputs.artifact-id || '' }}
      context-linux-amd64: ${{ matrix.key == 'linux-amd64' && steps.context-upload.outputs.artifact-id || '' }}
      context-linux-arm64: ${{ matrix.key == 'linux-arm64' && steps.context-upload.outputs.artifact-id || '' }}
      context-darwin-arm64: ${{ matrix.key == 'darwin-arm64' && steps.context-upload.outputs.artifact-id || '' }}
      original-reader: ${{ steps.original-reader.outputs.artifact-id }}
      tool-linux-arm64: ${{ matrix.key == 'linux-arm64' && steps.tool-upload.outputs.artifact-id || '' }}
      tool-darwin-arm64: ${{ matrix.key == 'darwin-arm64' && steps.tool-upload.outputs.artifact-id || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            key: linux-amd64
            archive: mesh_linux_amd64.tar.gz
            runner: ubuntu-24.04
          - platform: linux/arm64
            key: linux-arm64
            archive: mesh_linux_arm64.tar.gz
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            key: darwin-arm64
            archive: mesh_darwin_arm64.tar.gz
            runner: macos-15
    # Release preparation and proof batches use the hosted Mac capacity so
    # they can start while the owner's Mac FIFO is occupied.
    runs-on: ${{ !inputs.draft && matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","mesh-mac-shared"]') || matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.policy.outputs.artifact || '0' }}
          path: ${{ runner.temp }}/mesh-policy
      - name: Recover exact reserved draft archives
        if: inputs.draft
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact || '0' }}
          path: ${{ runner.temp }}/release-candidate
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/mesh-release-baselines
          key: mesh-native-baselines-${{ matrix.key }}-${{ needs.policy.outputs.version }}
          restore-keys: mesh-native-baselines-${{ matrix.key }}-
      - name: Build the native candidate and startup-fault fixture once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.policy.outputs.version }}
          SOURCE: ${{ inputs.source_sha }}
          PREVIOUS: ${{ needs.policy.outputs.previous }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ matrix.archive }}
          DRAFT: ${{ inputs.draft }}
          BASELINE_ASSETS: ${{ inputs.baseline_assets }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$PLATFORM"
          root="$RUNNER_TEMP/mesh-native.noindex"
          mkdir -p "$root"
          python3 scripts/fixtures/noindex_paths.py "$root" > "$root/noindex-setup.json"
          export MESH_BASELINE_CACHE="$HOME/.cache/mesh-release-baselines"
          export MESH_RELEASE_SELECTION="$RUNNER_TEMP/mesh-policy/selection.json"
          if [[ $DRAFT == true ]]; then
            intake="$RUNNER_TEMP/release-candidate"
            python3 scripts/prepare-draft-intake.py verify "$intake" "$VERSION" "$SOURCE" --baselines "$BASELINE_ASSETS" --run "$GITHUB_RUN_ID"
            export MESH_DRAFT_INTAKE="$intake" MESH_DRAFT_SOURCE="$SOURCE"
            scripts/prepare-update-proof-tools.sh "$root/tools" "$VERSION" "$intake/$ARCHIVE"
          else
            scripts/prepare-update-proof-tools.sh "$root/tools" "$VERSION"
          fi
          python3 scripts/probe-update-reader.py "$root/tools/candidate" "$VERSION" "$PLATFORM" "$root/tools/candidate-reader.json"
          if [[ $DRAFT == true ]]; then
            python3 scripts/prepare-draft-intake.py native "$intake" "$VERSION" "$SOURCE" --platform "$PLATFORM" --report "$root/tools/candidate-reader.json" --run "$GITHUB_RUN_ID"
          fi
          # macOS mktemp fills only trailing X's, so the .noindex suffix (Spotlight
          # exclusion) goes on a unique name that mkdir then creates exclusively.
          short=$(mktemp -u /tmp/mw-XXXXXX).noindex && mkdir -m 700 "$short"
          trap 'rm -rf -- "$short"' EXIT
          TMPDIR="$short" MESH_SHORT_TMP="$short" MESH_LEGACY_BINARY="$root/tools/candidate" "$root/tools/worker-probe" -test.v -test.run=^TestLegacyWorkerProcessProtocolAndVersion$ | tee "$root/tools/candidate-worker.log"
          grep -Fq -- '--- PASS: TestLegacyWorkerProcessProtocolAndVersion' "$root/tools/candidate-worker.log"
          scripts/prepare-release-baselines.sh "$VERSION" "$PREVIOUS" "$PLATFORM" "$BASELINE_ASSETS" "$root/retained" "$root/retained.list"
          if [[ $DRAFT == true ]]; then
            python3 scripts/prepare-rollback-context.py record "$root/tools" "$root/retained.list" "$intake/$ARCHIVE"
          else
            python3 scripts/prepare-rollback-context.py record "$root/tools" "$root/retained.list"
          fi
          python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); p.write_text("".join(str(Path(v).relative_to(p.parent))+"\n" for v in p.read_text().splitlines()))' "$root/retained.list"
      - id: native-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-native-${{ matrix.key }}
          path: ${{ runner.temp }}/mesh-native.noindex
          if-no-files-found: error
          overwrite: ${{ inputs.draft }}
          retention-days: ${{ inputs.draft && 7 || 1 }}
      # Cache's solid zstd archive shares bytes between historical executables.
      # Keep the full artifact for installed consumers and cache misses.
      - name: Cache this exact native preparation for parallel proofs
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/mesh-native.noindex
          key: mesh-native-inputs-v2-${{ steps.native-upload.outputs.artifact-id }}
      - id: context-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-context-${{ matrix.key }}
          path: ${{ runner.temp }}/mesh-native.noindex/tools/rollback-artifact.json
          if-no-files-found: error
          overwrite: ${{ inputs.draft }}
          retention-days: 7
      - id: original-reader
        if: inputs.draft && matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-original-schema1-executable
          path: ${{ runner.temp }}/mesh-native.noindex/retained/release-v0.1.249/mesh
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Build the SOURCE release tools for this reader target
        if: inputs.draft && matrix.platform != 'linux/amd64'
        env:
          GOTOOLCHAIN: local
          MESH_RELEASE_TOOL_SOURCE: ${{ inputs.source_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/build-source-release-tools.sh "$RUNNER_TEMP/history-tools" "$PLATFORM"
      - id: tool-upload
        if: inputs.draft && matrix.platform != 'linux/amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tool-source-${{ matrix.key }}
          path: ${{ runner.temp }}/history-tools/${{ matrix.key }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Remove native staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mesh-native.noindex" "$RUNNER_TEMP/mesh-policy" "$RUNNER_TEMP/release-candidate" "$RUNNER_TEMP/history-tools"

  context:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.producer.outputs.source }}
      run: ${{ steps.producer.outputs.run }}
      artifact: ${{ steps.context-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ format('{0},{1},{2}', needs.prepare.outputs.context-linux-amd64 || '0', needs.prepare.outputs.context-linux-arm64 || '0', needs.prepare.outputs.context-darwin-arm64 || '0') }}
          path: ${{ runner.temp }}/rollback-context
      - name: Export the actual native preparation source and run
        id: producer
        env:
          SOURCE: ${{ inputs.source_sha }}
          RUN: ${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          printf 'source=%s\nrun=%s\n' "$SOURCE" "$RUN" >> "$GITHUB_OUTPUT"
      - name: Aggregate only actual native artifact metadata
        run: python3 scripts/prepare-rollback-context.py assemble "$RUNNER_TEMP/rollback-context" "$RUNNER_TEMP/rollback-context/mesh-release-context.json"
      - id: context-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-rollback-manifest
          path: ${{ runner.temp }}/rollback-context/mesh-release-context.json
          if-no-files-found: error
          overwrite: ${{ inputs.draft }}
          retention-days: 7
      - name: Remove context staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rollback-context"

  prove:
    name: prove (${{ matrix.platform }}, ${{ matrix.shard }})
    needs: [policy, prepare, context]
    outputs:
      linux-amd64-0: ${{ inputs.draft && matrix.key == 'linux-amd64' && matrix.shard == 0 && steps.proof-upload.outputs.artifact-id || '' }}
      linux-amd64-1: ${{ inputs.draft && matrix.key == 'linux-amd64' && matrix.shard == 1 && steps.proof-upload.outputs.artifact-id || '' }}
      linux-arm64-0: ${{ inputs.draft && matrix.key == 'linux-arm64' && matrix.shard == 0 && steps.proof-upload.outputs.artifact-id || '' }}
      linux-arm64-1: ${{ inputs.draft && matrix.key == 'linux-arm64' && matrix.shard == 1 && steps.proof-upload.outputs.artifact-id || '' }}
      darwin-arm64-0: ${{ inputs.draft && matrix.key == 'darwin-arm64' && matrix.shard == 0 && steps.proof-upload.outputs.artifact-id || '' }}
      darwin-arm64-1: ${{ inputs.draft && matrix.key == 'darwin-arm64' && matrix.shard == 1 && steps.proof-upload.outputs.artifact-id || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.prove) }}
    runs-on: ${{ !inputs.draft && matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","mesh-mac-shared"]') || matrix.runner }}
    timeout-minutes: ${{ (inputs.draft || (matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))) && 105 || 60 }}
    env:
      NATIVE_ARTIFACT: ${{ needs.prepare.outputs[format('native-{0}', matrix.key)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - name: Initialize this AMD64 shard EPERM unit and healthy control
        if: matrix.platform == 'linux/amd64'
        env:
          MESH_WORKER_EPERM_SUDO: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.policy.outputs.shards }}
        run: |
          python3 scripts/native-eperm-policy.py initialize "$RUNNER_TEMP/update-proof" --shard "$SHARD" --shards "$SHARDS"
          printf 'MESH_WORKER_EPERM_LEDGER=%s\nMESH_WORKER_EPERM_SUDO=1\n' "$RUNNER_TEMP/update-proof/eperm-ledger.json" >> "$GITHUB_ENV"
      - name: Create owned excluded native extraction root
        run: |
          mkdir -p "$RUNNER_TEMP/mesh-native.noindex"
          python3 scripts/fixtures/noindex_paths.py "$RUNNER_TEMP/mesh-native.noindex"
      # The native inputs are about 1.4 GB. These caps only catch a stuck
      # transfer: the owner's Mac downloads at about 6 MB/s, about 4 minutes.
      - name: Restore this exact producer's native proof inputs
        id: native-cache
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/mesh-native.noindex
          key: mesh-native-inputs-v2-${{ env.NATIVE_ARTIFACT }}
      - name: Remove incomplete cached inputs before artifact fallback
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf -- "$RUNNER_TEMP/mesh-native.noindex"
          mkdir -p "$RUNNER_TEMP/mesh-native.noindex"
      - name: Download native proof inputs
        id: native-download
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ env.NATIVE_ARTIFACT || '0' }}
          path: ${{ runner.temp }}/mesh-native.noindex
      - name: Remove incomplete native inputs before the single retry
        if: steps.native-download.outcome == 'failure'
        run: |
          rm -rf -- "$RUNNER_TEMP/mesh-native.noindex"
          mkdir -p "$RUNNER_TEMP/mesh-native.noindex"
      - name: Retry native proof inputs once
        if: steps.native-download.outcome == 'failure'
        timeout-minutes: 15
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ env.NATIVE_ARTIFACT || '0' }}
          path: ${{ runner.temp }}/mesh-native.noindex
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.context.outputs.artifact || '0' }}
          path: ${{ runner.temp }}/mesh-native.noindex
      - name: Exercise required sources with the actual native executables
        env:
          PLATFORM: ${{ matrix.platform }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.policy.outputs.shards }}
          DRAFT: ${{ inputs.draft }}
          SOURCE: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -u /tmp/ms-XXXXXX).noindex && mkdir -m 700 "$scratch"
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch" MESH_SHORT_TMP="$scratch" PYTHONDONTWRITEBYTECODE=1
          if [[ -n ${MESH_WORKER_EPERM_LEDGER:-} ]]; then
            python3 scripts/native-eperm-policy.py begin "$RUNNER_TEMP/update-proof" "$scratch"
            trap 'status=$?; python3 scripts/native-eperm-policy.py returned "$RUNNER_TEMP/update-proof" "$status"' EXIT
          fi
          root="$RUNNER_TEMP/mesh-native.noindex"
          args=(--manifest "$root/mesh-release-context.json")
          if [[ $DRAFT == true ]]; then
            PYTHONPATH=scripts python3 -m fixtures.installed_artifacts native "$root" "$SOURCE" "$PLATFORM"
            args+=(--batch)
          fi
          chmod +x "$root"/tools/candidate "$root"/tools/startup-fault-candidate "$root"/tools/boundary "$root"/tools/worker-probe
          find "$root/retained" -type f -name mesh -exec chmod +x {} +
          count=$(python3 -c 'import json,os; print(len(json.loads(os.environ["SHARDS"])))')
          python3 scripts/run-update-proofs.py "$root/tools" "$root/retained.list" "$PLATFORM" "$RUNNER_TEMP/update-proof" --shard "$SHARD" --shards "$count" "${args[@]}"
      - name: Audit control and diagnostic ownership before removing native payloads
        id: eperm-cleanup
        if: always() && matrix.platform == 'linux/amd64'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/native-eperm-policy.py cleanup "$RUNNER_TEMP/update-proof" "$RUNNER_TEMP/mesh-native.noindex"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: proof-upload
        if: always()
        with:
          name: update-proofs-${{ matrix.key }}-${{ matrix.shard }}${{ inputs.draft && format('-attempt-{0}', github.run_attempt) || '' }}
          path: ${{ runner.temp }}/update-proof
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: counter-upload
        if: always() && matrix.platform == 'linux/amd64'
        with:
          name: native-eperm-counter-linux-amd64-${{ matrix.shard }}${{ inputs.draft && format('-attempt-{0}', github.run_attempt) || '' }}
          path: ${{ runner.temp }}/update-proof/eperm-counter.json
          retention-days: 7
      - name: Remove proof staging
        if: always() && matrix.platform != 'linux/amd64'
        run: rm -rf -- "$RUNNER_TEMP/mesh-native.noindex" "$RUNNER_TEMP/update-proof"
      - name: Remove uploaded EPERM proof evidence after confirmed cleanup
        if: always() && matrix.platform == 'linux/amd64' && steps.eperm-cleanup.outcome == 'success' && steps.proof-upload.outcome == 'success' && steps.counter-upload.outcome == 'success'
        run: rm -rf -- "$RUNNER_TEMP/update-proof"

  reader:
    name: ${{ inputs.draft && 'Original schema 1 release reader' || 'AMD64 EPERM run summary' }}
    needs: [policy, prepare, prove]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      proof_artifacts: ${{ steps.proof-uploads.outputs.ids }}
      manifest_artifact: ${{ steps.legacy-manifest.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-eperm-counter-linux-amd64-*
          path: ${{ runner.temp }}/eperm-summary/inputs
      - name: Report all AMD64 recurrences for parent investigation
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SHARDS: ${{ needs.policy.outputs.shards }}
        run: python3 scripts/summarize-native-eperm.py "$RUNNER_TEMP/eperm-summary/inputs" "$RUNNER_TEMP/eperm-summary/result/summary.json" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --shards "$SHARDS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-eperm-run-summary
          path: ${{ runner.temp }}/eperm-summary/result
          retention-days: 7
          overwrite: ${{ inputs.draft }}
      - name: Select every release batch upload from its producing job
        id: proof-uploads
        if: inputs.draft
        env:
          PROOF_RESULT: ${{ needs.prove.result }}
          PROOF_MATRIX: ${{ needs.policy.outputs.prove }}
          PROOF_UPLOADS: ${{ toJSON(needs.prove.outputs) }}
        run: |
          test "$PROOF_RESULT" = success
          python3 scripts/collect-update-proofs.py --artifact-ids
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.proof-uploads.outcome == 'success' && inputs.draft
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.proof-uploads.outcome == 'success' && inputs.draft
        with:
          artifact-ids: ${{ needs.prepare.outputs.original-reader || '0' }}
          path: ${{ runner.temp }}/original-reader
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.proof-uploads.outcome == 'success' && inputs.draft
        with:
          artifact-ids: ${{ steps.proof-uploads.outputs.ids || '0' }}
          path: ${{ runner.temp }}/reader-proofs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.proof-uploads.outcome == 'success' && inputs.draft
        with:
          artifact-ids: ${{ needs.policy.outputs.artifact || '0' }}
          path: ${{ runner.temp }}/mesh-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.proof-uploads.outcome == 'success' && inputs.draft
        with:
          artifact-ids: ${{ inputs.candidate_artifact || '0' }}
          path: ${{ runner.temp }}/release-candidate
      - name: Decode generated assets with the unchanged published executable
        if: steps.proof-uploads.outcome == 'success' && inputs.draft
        env:
          VERSION: ${{ needs.policy.outputs.version }}
          SOURCE: ${{ inputs.source_sha }}
          PROOF_MATRIX: ${{ needs.policy.outputs.prove }}
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -u /tmp/ms-XXXXXX).noindex && mkdir -m 700 "$scratch"
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch" MESH_SHORT_TMP="$scratch" PYTHONDONTWRITEBYTECODE=1
          root="$RUNNER_TEMP/reader"
          mkdir -p "$root"
          python3 scripts/collect-update-proofs.py "$RUNNER_TEMP/reader-proofs" "$root/proofs" "$RUNNER_TEMP/mesh-policy/selection.json" "$(git rev-parse HEAD)"
          candidate="$RUNNER_TEMP/release-candidate"
          python3 scripts/prepare-draft-intake.py verify "$candidate" "$VERSION" "$SOURCE" --run "$GITHUB_RUN_ID"
          scripts/assemble-release-compatibility.py "$root/proofs" "$root/compatibility.json"
          scripts/generate-release-manifest.sh -dist "$candidate" -version "$VERSION" -commit "$SOURCE" -compatibility "$root/compatibility.json" -proofs "$root/proofs" -output "$root/mesh-release.json"
          python3 scripts/collect-update-proofs.py --check-batches "$RUNNER_TEMP/reader-proofs" "$root/mesh-release.json"
          original="$RUNNER_TEMP/original-reader/mesh"
          chmod +x "$original"
          python3 scripts/prove-legacy-release-reader.py "$original" "$RUNNER_TEMP/mesh-policy/documents" "$root/mesh-release.json" "$root/proofs" "$root/evidence" --history-inventory "$RUNNER_TEMP/mesh-policy/history.json"
      - id: legacy-manifest
        if: steps.proof-uploads.outcome == 'success' && inputs.draft
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-verified-legacy-manifest
          path: ${{ runner.temp }}/reader/mesh-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && inputs.draft
        with:
          name: original-schema1-reader
          path: ${{ runner.temp }}/reader/evidence
          overwrite: true
          retention-days: 7
      - name: Remove reader staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/reader" "$RUNNER_TEMP/original-reader" "$RUNNER_TEMP/reader-proofs" "$RUNNER_TEMP/mesh-policy" "$RUNNER_TEMP/release-candidate" "$RUNNER_TEMP/eperm-summary"
