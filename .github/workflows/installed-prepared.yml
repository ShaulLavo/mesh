name: Prepared installed cohort

on:
  workflow_call:
    inputs:
      native_platform:
        required: true
        type: string
        description: 'One native platform for this independent preparation and profile pipeline'
      mode:
        required: true
        type: string
        description: 'One complete chain or waypoint case'
      harness_source:
        required: true
        type: string
      worker_artifact_prefix:
        required: true
        type: string
      worker_artifact_run:
        required: true
        type: number
      worker_artifact_source:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  MESH_HARNESS_SOURCE: ${{ inputs.harness_source }}
  MESH_PREPARATION_SOURCE: ${{ inputs.worker_artifact_source }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/scripts

concurrency:
  group: prepared-cohort-${{ inputs.native_platform }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.workflow }}-${{ inputs.worker_artifact_run }}-${{ inputs.worker_artifact_source }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      case: ${{ steps.selection.outputs.case }}
      profiles: ${{ steps.selection.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source }}
      - name: Select native case and all complete profiles
        id: selection
        env:
          NATIVE_PLATFORM: ${{ inputs.native_platform }}
          PROOF_MODE: ${{ inputs.mode }}
        run: python3 scripts/fixtures/installed_workflow.py case --platform "$NATIVE_PLATFORM" --mode "$PROOF_MODE"

  prepare:
    needs: selection
    name: Prepare once (${{ matrix.platform }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.case) }}
    steps:
      - name: Record job duration before checkout and setup
        run: |
          python3 -c 'import json,os,time; p=os.environ["RUNNER_TEMP"]+"/installed-job-clock.json"; json.dump({"origin_ns":time.monotonic_ns(),"run":os.environ["GITHUB_RUN_ID"],"job":os.environ["GITHUB_JOB"]},open(p,"x"))'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source }}
      - name: Require actual native manager before acquisition or builds
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/prove-installed-catchup.sh "$RUNNER_TEMP/cohort-control"
      - uses: ./.github/actions/installed-go
      - name: Pin complete original producer intake and measure space before transfer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.worker_artifact_run }}
          PRODUCER_SOURCE: ${{ inputs.worker_artifact_source }}
          PRODUCER_PREFIX: ${{ inputs.worker_artifact_prefix }}
          ARTIFACT_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          python3 scripts/fixtures/installed_artifacts.py set "$GITHUB_REPOSITORY" "$PRODUCER_RUN" "$PRODUCER_SOURCE" "$PRODUCER_PREFIX" "$RUNNER_TEMP/cohort-control/producer-pin.json"
          mkdir -p "$RUNNER_TEMP/native-worker-input.noindex"
          python3 scripts/fixtures/installed_storage.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/cohort-control/producer-pin.json" "$ARTIFACT_KEY" "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/cohort-control/storage-preflight.json"
          python3 scripts/fixtures/installed_artifacts.py download "$GITHUB_REPOSITORY" "$RUNNER_TEMP/cohort-control/producer-pin.json" "$ARTIFACT_KEY" "$RUNNER_TEMP/native-worker-input.noindex" "$RUNNER_TEMP/cohort-control/worker-download.json"
      - name: Prepare complete releases and native proofs once and export public bundle
        timeout-minutes: 25
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          SOURCE_HOST: ${{ matrix.host }}
          PROOF_MODE: ${{ matrix.mode }}
          MESH_OWNED_WORKER_INPUT: ${{ runner.temp }}/native-worker-input.noindex
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/native-worker-input.noindex"
          python3 scripts/fixtures/installed_artifacts.py native "$input" "$MESH_PREPARATION_SOURCE" "$INSTALLED_CATCHUP_PLATFORM"
          chmod +x "$input/tools/worker-probe"
          mkdir -p "$RUNNER_TEMP/native-tools.noindex"
          go build -o "$RUNNER_TEMP/native-tools.noindex/native-helper" ./scripts/fixtures/native-helper
          mode=(--signed-chain)
          if [[ $PROOF_MODE == waypoint ]]; then mode=(--format-waypoint); fi
          printf '{"started":true}\n' > "$RUNNER_TEMP/cohort-control/fixture-launch.json"
          python3 scripts/prove-installed-catchup.py "$RUNNER_TEMP/cohort-proof" --native-preflight --installed-adoption \
            --launch-record "$RUNNER_TEMP/cohort-control/fixture-launch.json" \
            --native-helper "$RUNNER_TEMP/native-tools.noindex/native-helper" --worker-registry "$input/retained/workers.json" \
            --worker-probe "$input/tools/worker-probe" --source-host "$SOURCE_HOST" "${mode[@]}" \
            --export-prepared "$RUNNER_TEMP/prepared.noindex"
      - name: Remove original inputs only after actual runtime teardown
        if: always()
        run: python3 scripts/fixtures/installed_workflow.py cleanup "$RUNNER_TEMP"
      - name: Pack one mode-preserving public transfer after runtime teardown
        run: python3 scripts/fixtures/installed_workflow.py pack "$RUNNER_TEMP/prepared.noindex" "$RUNNER_TEMP/prepared-transfer.noindex"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-prepared-${{ matrix.key }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/prepared-transfer.noindex/bundle.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Remove uploaded public payload after verified runtime cleanup
        run: python3 scripts/fixtures/installed_workflow.py cleanup "$RUNNER_TEMP" --bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-preparation-evidence-${{ matrix.key }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/installed-job-clock.json
            ${{ runner.temp }}/cohort-control
            ${{ runner.temp }}/cohort-proof
            ${{ runner.temp }}/prepared.noindex/prepared.json
            ${{ runner.temp }}/prepared.noindex/prepared-workers.json
            ${{ runner.temp }}/prepared.noindex/provenance.json
          compression-level: 0
          retention-days: 7
      - name: Report observed job duration through uploads
        if: always()
        run: python3 scripts/fixtures/installed_clock.py job-finish "$RUNNER_TEMP/installed-job-clock.json" "$RUNNER_TEMP/cohort-proof/fixture-clock.json"

  consume:
    needs: [selection, prepare]
    name: Complete profile (${{ matrix.platform }}, ${{ matrix.mode }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.selection.outputs.profiles) }}
        include: ${{ fromJSON(needs.selection.outputs.case).include }}
    steps:
      - name: Record job duration before checkout and setup
        run: |
          python3 -c 'import json,os,time; p=os.environ["RUNNER_TEMP"]+"/installed-job-clock.json"; json.dump({"origin_ns":time.monotonic_ns(),"run":os.environ["GITHUB_RUN_ID"],"job":os.environ["GITHUB_JOB"]},open(p,"x"))'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source }}
      - name: Require actual native manager before bundle acquisition
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/prove-installed-catchup.sh "$RUNNER_TEMP/cohort-control"
      - name: Measure space and acquire the single same-run prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ARTIFACT: installed-prepared-${{ matrix.key }}-${{ matrix.mode }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 scripts/fixtures/installed_workflow.py fetch "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BUNDLE_ARTIFACT" "$RUNNER_TEMP/prepared.noindex" "$RUNNER_TEMP/cohort-control"
          python3 scripts/fixtures/installed_workflow.py select "$RUNNER_TEMP/prepared.noindex" "$PROFILE" "$RUNNER_TEMP/cohort-control/installed-slice.json"
      - name: Run one complete authoritative installed profile using bundled helper
        timeout-minutes: 25
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          SOURCE_HOST: ${{ matrix.host }}
          PROOF_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mode=(--signed-chain)
          if [[ $PROOF_MODE == waypoint ]]; then mode=(--format-waypoint); fi
          printf '{"started":true}\n' > "$RUNNER_TEMP/cohort-control/fixture-launch.json"
          python3 scripts/prove-installed-catchup.py "$RUNNER_TEMP/cohort-proof" --native-preflight --installed-adoption \
            --launch-record "$RUNNER_TEMP/cohort-control/fixture-launch.json" \
            --source-host "$SOURCE_HOST" "${mode[@]}" \
            --prepared-releases "$RUNNER_TEMP/prepared.noindex" --installed-slice "$RUNNER_TEMP/cohort-control/installed-slice.json"
      - name: Remove bundled payload only after actual runtime teardown
        if: always()
        run: python3 scripts/fixtures/installed_workflow.py cleanup "$RUNNER_TEMP" --bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-slice-${{ matrix.key }}-${{ matrix.mode }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/installed-job-clock.json
            ${{ runner.temp }}/cohort-control
            ${{ runner.temp }}/cohort-proof
            ${{ runner.temp }}/prepared.noindex/prepared.json
            ${{ runner.temp }}/prepared.noindex/prepared-workers.json
            ${{ runner.temp }}/prepared.noindex/provenance.json
          compression-level: 0
          retention-days: 7
      - name: Report observed job duration through upload
        if: always()
        run: python3 scripts/fixtures/installed_clock.py job-finish "$RUNNER_TEMP/installed-job-clock.json" "$RUNNER_TEMP/cohort-proof/fixture-clock.json"

  aggregate:
    needs: [selection, prepare, consume]
    if: always() && needs.selection.result == 'success'
    name: Exact prepared coverage (${{ matrix.key }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.case) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_source }}
      - name: Require successful producer and consumers before downloading closure inputs
        env:
          PREPARATION_RESULT: ${{ needs.prepare.result }}
          CONSUMER_RESULT: ${{ needs.consume.result }}
        run: |
          test "$PREPARATION_RESULT" = success
          test "$CONSUMER_RESULT" = success
      - name: Measure space and acquire the exact prepared bytes for closure
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ARTIFACT: installed-prepared-${{ matrix.key }}-${{ matrix.mode }}
        run: python3 scripts/fixtures/installed_workflow.py fetch "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BUNDLE_ARTIFACT" "$RUNNER_TEMP/prepared.noindex" "$RUNNER_TEMP/aggregate-control"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installed-preparation-evidence-${{ matrix.key }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/preparation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installed-slice-${{ matrix.key }}-${{ matrix.mode }}-*
          path: ${{ runner.temp }}/consumers
      - name: Require producer completion and exact profile group reader closure
        env:
          ARTIFACT_KEY: ${{ matrix.key }}
          PROOF_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          consumers=()
          for profile in none first final; do
            consumers+=("$RUNNER_TEMP/consumers/installed-slice-$ARTIFACT_KEY-$PROOF_MODE-$profile/cohort-proof")
          done
          python3 scripts/aggregate-installed-slices.py "$RUNNER_TEMP/prepared.noindex" "$RUNNER_TEMP/preparation/cohort-proof" "$RUNNER_TEMP/aggregate-control/result.json" "${consumers[@]}"
      - name: Remove aggregate-owned input copies after the pure closure command
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/prepared.noindex" "$RUNNER_TEMP/prepared-transfer.noindex" "$RUNNER_TEMP/preparation" "$RUNNER_TEMP/consumers"
          test ! -e "$RUNNER_TEMP/prepared.noindex"
          test ! -e "$RUNNER_TEMP/prepared-transfer.noindex"
          test ! -e "$RUNNER_TEMP/preparation"
          test ! -e "$RUNNER_TEMP/consumers"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-prepared-aggregate-${{ matrix.key }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/aggregate-control
          retention-days: 7
