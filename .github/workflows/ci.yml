name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  app-pill:
    name: Solid app pill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.24.0
      - run: pnpm --dir web/app-pill install --frozen-lockfile
      - run: pnpm --dir web/app-pill build
      - name: Require current embedded assets and upstream adaptations
        run: git diff --exit-code -- internal/apppill/assets web/app-pill/src/grab
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install confirmation browser engines
        run: pnpm --dir web/app-pill exec playwright install --with-deps chromium webkit
      - name: Verify desktop and mobile confirmation guards
        env:
          MESH_CONFIRM_BROWSER_DIR: ${{ runner.temp }}/mesh-confirm
        run: |
          mkdir -p "$MESH_CONFIRM_BROWSER_DIR"
          go test ./internal/apps -run '^TestConfirmationBrowserPages$' -count=1
          node web/app-pill/tests/confirm.mjs "$MESH_CONFIRM_BROWSER_DIR"

  test:
    name: Race tests and integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a tidy module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Integration tests
        env:
          MESH_INTEGRATION_TIMEOUT: 60s
        run: ./scripts/verify.sh

  lint:
    name: golangci-lint v2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --enable-only=bodyclose,errcheck,gosec,govet,ineffassign,staticcheck,unused

  gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
      - name: Install pinned ShellCheck, Ruff, and Lefthook
        run: |
          mkdir -p "$RUNNER_TEMP/gates-tools"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL https://github.com/astral-sh/ruff/releases/download/0.16.9/ruff-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/ruff.tar.gz"
          echo "1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13  $RUNNER_TEMP/ruff.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL https://github.com/evilmartians/lefthook/releases/download/v2.1.15/lefthook_2.1.15_Linux_x86_64.gz -o "$RUNNER_TEMP/lefthook.gz"
          echo "b3ed1e83389d0a98b5f243a8a1afcb0fdfad527834f87170f2a2ff9ddfe0f836  $RUNNER_TEMP/lefthook.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/lefthook.gz" > "$RUNNER_TEMP/gates-tools/lefthook"
          chmod +x "$RUNNER_TEMP/gates-tools/lefthook"
          echo "$RUNNER_TEMP/gates-tools" >> "$GITHUB_PATH"
      - name: Full gates
        run: ./scripts/gates.sh --report-dir "$RUNNER_TEMP/gates-reports"
      - name: Prove staged hooks in a linked worktree
        if: always()
        run: bash scripts/prove-hooks.sh "$RUNNER_TEMP/gates-reports/hooks"
      - name: Prove planted violations and baseline updates
        if: always()
        run: python3 .gates/prove.py --evidence "$RUNNER_TEMP/gates-reports/proofs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gates-reports
          path: ${{ runner.temp }}/gates-reports
          retention-days: 7

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck v1.7.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  packaging:
    name: Packaging contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean
      - name: Require main as the repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api 'repos/${{ github.repository }}' --jq .default_branch)" = main
      - name: Verify release and installer contracts
        run: ./scripts/check-packaging.sh dist

  gate:
    name: Complete CI gate
    if: always()
    needs: [app-pill, test, lint, gates, vulnerability, packaging]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job
        env:
          APP_PILL: ${{ needs.app-pill.result }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          GATES: ${{ needs.gates.result }}
          VULNERABILITY: ${{ needs.vulnerability.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          [[ $APP_PILL == success && $TEST == success && $LINT == success && $GATES == success && $VULNERABILITY == success && $PACKAGING == success ]]

  publish:
    name: Publish tested main commit
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      checks: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ github.sha }}
