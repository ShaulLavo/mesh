name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  app-pill:
    name: Solid app pill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
      - run: pnpm --dir web/app-pill install --frozen-lockfile
      - run: pnpm --dir web/app-pill build
      - name: Require current embedded assets
        run: git diff --exit-code -- internal/apppill/assets
      - run: pnpm --dir web/app-pill test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install confirmation browser engines
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          pnpm --dir web/app-pill exec playwright install --with-deps chromium webkit
      - name: Verify desktop and mobile confirmation guards
        env:
          MESH_CONFIRM_BROWSER_DIR: ${{ runner.temp }}/mesh-confirm
        run: |
          mkdir -p "$MESH_CONFIRM_BROWSER_DIR"
          go test ./internal/apps -run '^TestConfirmationBrowserPages$' -count=1
          node web/app-pill/tests/confirm.mjs "$MESH_CONFIRM_BROWSER_DIR"
      - name: Verify the pill docks at one position on every edge
        run: node web/app-pill/tests/snap.mjs

  test:
    name: Race tests and integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a tidy module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Integration tests
        env:
          MESH_INTEGRATION_TIMEOUT: 60s
        run: ./scripts/verify.sh

  socket-portability:
    name: Native socket and daemon fixtures (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify full daemon suite under long and symlinked scratch
        shell: bash
        run: |
          short=$(mktemp -d /tmp/ms-XXXXXX)
          long=$(mktemp -d "$RUNNER_TEMP/mesh-socket-portability-long-scratch-root.XXXXXX")
          trap 'rm -rf -- "$short" "$long"' EXIT
          ln -s "$long" "$short/alias"
          TMPDIR="$short/alias/" MESH_SHORT_TMP="$short" go test -race -count=1 -timeout=180s -json ./internal/daemon ./internal/cli ./internal/worker ./internal/updatebootstrap ./internal/paths ./internal/testenv | tee "$RUNNER_TEMP/native-socket-results.jsonl"
          MESH_SHORT_TMP="$short" python3 scripts/test-helper-recovery-paths.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-socket-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-socket-results.jsonl
          retention-days: 7

  auth-cutover:
    name: Device auth cutover (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the actual native platform
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify fixture TLS and published artifact boundaries
        run: |
          python3 scripts/test-fixture-tls.py
          python3 scripts/test-published-releases.py
      - name: Verify native authentication regressions
        run: |
          go test -race -count=1 -timeout=180s -run 'Test(QueriedKeyMustNotOwnAuthenticatedSSHGrant|BootstrapReapprovalMustNotHealBareGrant|BootstrapMustSerializeWithDeviceRevocation|GrantLockMustRespectHandshakeCancellation|ManagedGrantWriterBoundsLockContention|GrantPolicyRejectsSpecialFilesWithoutBlocking|PublishedGrantSurvivesOtherAndIdempotentWriterContention|GrantContentionReleasesRealControlSlotBeforeUnlock|UpdaterPolicyFIFOReleasesRealControlSlot|UpdaterPolicyUnsafeSnapshotsRejectRealTLS|DarwinInstallerLaunchdActivation)$' ./internal/identity ./internal/transport ./internal/sshd ./internal/daemon ./scripts/install
      - name: Verify native pinned-fleet enrollment
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/device-enrollment-test.log"
          go test -race -count=1 -timeout=180s -v -run '^Test(CheckedApproval|ApproveFleet)' ./internal/cli | tee "$output"
          command grep -Fq -- '--- PASS: TestCheckedApprovalNativeBindingAndIdempotency ' "$output"
          command grep -Fq -- '--- PASS: TestApproveFleetSystemSSHRequiresExistingHostKeyTrust ' "$output"
          bash integration/device_enrollment.sh
      - name: Verify Darwin retains its mapped executable
        if: matrix.platform == 'darwin/arm64'
        run: |
          output="$RUNNER_TEMP/darwin-mapped-executable-test.log"
          go test -count=1 -run '^TestDarwinMappedExecutableSurvivesAtomicReplacement$' -v ./internal/updatebootstrap | tee "$output"
          grep -Fq -- '--- PASS: TestDarwinMappedExecutableSurvivesAtomicReplacement' "$output"
      - name: Exercise old local cutover and authenticated fleet recovery
        env:
          AUTH_CUTOVER_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-device-auth-cutover.sh "$RUNNER_TEMP/auth-cutover"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-auth-cutover-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/auth-cutover
            ${{ runner.temp }}/darwin-mapped-executable-test.log
            ${{ runner.temp }}/device-enrollment-test.log
          retention-days: 7

  machine-naming:
    name: Destination naming (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the actual native platform
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify destination persistence, publication and authentication
        run: |
          set -euo pipefail
          go test -race -count=1 ./internal/machinename ./internal/protocol
          if [[ "$(go env GOHOSTOS)" == darwin ]]; then
            output="$RUNNER_TEMP/machine-naming-daemon.log"
            go test -race -count=1 -v -run '^Test(DestinationNamePublishedAfterCommitAndRetryCoalesces|HostRenameErrorsAreStructuredAndWatchReadOnly|HostRenameCannotHealRevokedConnection)$' ./internal/daemon | tee "$output"
            for test in TestDestinationNamePublishedAfterCommitAndRetryCoalesces TestHostRenameErrorsAreStructuredAndWatchReadOnly TestHostRenameCannotHealRevokedConnection; do
              grep -Fq -- "--- PASS: $test " "$output"
            done
          else
            go test -race -count=1 ./internal/daemon
          fi
      - name: Verify native retained terminal and authenticated source transition
        env:
          NAMING_PROOF_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-machine-naming.sh "$RUNNER_TEMP/machine-naming"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: machine-naming-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/machine-naming
            ${{ runner.temp }}/machine-naming-daemon.log
          retention-days: 7

  lint:
    name: golangci-lint v2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --enable-only=bodyclose,errcheck,gosec,govet,ineffassign,staticcheck,unused

  gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Verify CI download failure fixtures
        run: python3 scripts/test-ci-downloads.py
      - name: Install pinned ShellCheck, Ruff, and Lefthook
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/gates-tools"
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/astral-sh/ruff/releases/download/0.16.9/ruff-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/ruff.tar.gz"
          echo "1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13  $RUNNER_TEMP/ruff.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/evilmartians/lefthook/releases/download/v2.1.15/lefthook_2.1.15_Linux_x86_64.gz -o "$RUNNER_TEMP/lefthook.gz"
          echo "b3ed1e83389d0a98b5f243a8a1afcb0fdfad527834f87170f2a2ff9ddfe0f836  $RUNNER_TEMP/lefthook.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/lefthook.gz" > "$RUNNER_TEMP/gates-tools/lefthook"
          chmod +x "$RUNNER_TEMP/gates-tools/lefthook"
          echo "$RUNNER_TEMP/gates-tools" >> "$GITHUB_PATH"
      - name: Full gates
        run: ./scripts/gates.sh --report-dir "$RUNNER_TEMP/gates-reports"
      - name: Prove staged hooks in a linked worktree
        if: always()
        run: bash scripts/prove-hooks.sh "$RUNNER_TEMP/gates-reports/hooks"
      - name: Prove planted violations and baseline updates
        if: always()
        run: python3 .gates/prove.py --evidence "$RUNNER_TEMP/gates-reports/proofs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gates-reports
          path: ${{ runner.temp }}/gates-reports
          retention-days: 7

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck v1.7.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  packaging:
    name: Packaging contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify default-branch failure fixtures
        run: python3 scripts/test-check-default-branch.py
      - name: Require main as the repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-default-branch.py '${{ github.repository }}'
      - name: Verify release and installer contracts
        run: ./scripts/check-packaging.sh dist

  helper-recovery:
    name: Required native helper recovery
    uses: ./.github/workflows/helper-recovery.yml

  gate:
    name: Complete CI gate
    if: always()
    needs: [app-pill, test, socket-portability, auth-cutover, machine-naming, helper-recovery, lint, gates, vulnerability, packaging]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job
        env:
          APP_PILL: ${{ needs.app-pill.result }}
          TEST: ${{ needs.test.result }}
          SOCKET_PORTABILITY: ${{ needs.socket-portability.result }}
          AUTH_CUTOVER: ${{ needs.auth-cutover.result }}
          MACHINE_NAMING: ${{ needs.machine-naming.result }}
          HELPER_RECOVERY: ${{ needs.helper-recovery.result }}
          LINT: ${{ needs.lint.result }}
          GATES: ${{ needs.gates.result }}
          VULNERABILITY: ${{ needs.vulnerability.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          [[ $APP_PILL == success && $TEST == success && $SOCKET_PORTABILITY == success && $AUTH_CUTOVER == success && $MACHINE_NAMING == success && $HELPER_RECOVERY == success && $LINT == success && $GATES == success && $VULNERABILITY == success && $PACKAGING == success ]]

  publish:
    name: Publish tested main commit
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      checks: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ github.sha }}
