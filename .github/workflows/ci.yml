name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      client_interrupt:
        description: 'Diagnostic only: prepare the original PC fixture and observe one interrupted adoption'
        type: boolean
        default: false

permissions:
  contents: read

# Pushes to main share one group and never cancel: the running main CI always
# finishes, at most one newer main run waits, and GitHub replaces a waiting one
# with the next push. Releases run separately in release.yml on schedule or
# manual dispatch. PRs keep one group each and cancel superseded runs; manual
# runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-interrupt-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.client_interrupt
    name: Diagnostic only, one original-client interrupted adoption
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch only the immutable failed product source reference
        run: git fetch --no-tags --depth=1 https://github.com/ShaulLavo/mesh.git e46caa27a11a534345376df844cf30566d034efa
      - name: Refuse occupied canonical units before any native fixture work
        run: |
          mkdir -p "$RUNNER_TEMP/client-interrupt-diagnostic"
          git rev-parse HEAD > "$RUNNER_TEMP/client-interrupt-diagnostic/source-sha.txt"
          python3 -B scripts/diagnose-client-interrupt.py --check-host > "$RUNNER_TEMP/client-interrupt-diagnostic/host-baseline.json"
      - name: Install the external observer on this disposable runner
        uses: ./.github/actions/apt-packages
        with:
          packages: strace
      - uses: ./.github/actions/installed-go
      - name: Prepare the private PC fixture and observe one pc-interrupt
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/diagnose-client-interrupt.py --output "$RUNNER_TEMP/client-interrupt-diagnostic"
      - name: Verify native and preparation cleanup
        if: always()
        run: |
          python3 -B scripts/diagnose-client-interrupt.py --verify-cleanup --output "$RUNNER_TEMP/client-interrupt-diagnostic"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: client-interrupt-diagnostic
          path: ${{ runner.temp }}/client-interrupt-diagnostic
          retention-days: 7

  changes:
    if: ${{ !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      browser: ${{ steps.paths.outputs.browser }}
      packaging: ${{ steps.paths.outputs.packaging }}
      installed: ${{ steps.paths.outputs.installed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci-changes.py "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  app-pill:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Reusable floating pill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          cache: true
          cache_dependency_path: web/app-pill/pnpm-lock.yaml
      - run: pnpm --dir web/app-pill install --frozen-lockfile
      - run: pnpm --dir web/app-pill build
      - name: Require current embedded assets
        run: git diff --exit-code -- internal/apppill/assets
      - run: pnpm --dir web/app-pill test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Installing browsers together with their system packages always
      # refreshes apt from the live archive. Record the exact package list
      # Playwright would install, install it through the cached-apt action
      # (offline on a warm cache), then fetch only the browsers.
      - name: Resolve confirmation browser system packages
        id: browser-packages
        env:
          APT_RECORD: ${{ runner.temp }}/playwright-apt-arguments
        run: |
          PATH="$GITHUB_WORKSPACE/.github/actions/apt-packages/record:$PATH" pnpm --dir web/app-pill exec playwright install-deps --dry-run chromium webkit
          mapfile -t arguments < "$APT_RECORD"
          if [ "${arguments[*]:0:3}" != "install -s --no-install-recommends" ] || [ "${#arguments[@]}" -lt 4 ]; then
            echo "::error::Playwright changed its package simulation call: ${arguments[*]}"
            exit 1
          fi
          echo "packages=${arguments[*]:3}" >> "$GITHUB_OUTPUT"
      - name: Install confirmation browser system packages
        # A hang cap, not a speed limit: on a cold cache the main archive can
        # serve the 126 MB of browser dependencies at under 500 kB/s, which
        # alone takes 4 to 5 minutes.
        timeout-minutes: 25
        uses: ./.github/actions/apt-packages
        with:
          packages: ${{ steps.browser-packages.outputs.packages }}
          options: --no-install-recommends
      - name: Cache confirmation browser engines
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('web/app-pill/pnpm-lock.yaml') }}
      - name: Install confirmation browser engines
        # A hang cap, not a speed limit.
        timeout-minutes: 25
        run: pnpm --dir web/app-pill exec playwright install chromium webkit
      - name: Verify desktop and mobile confirmation guards
        env:
          MESH_CONFIRM_BROWSER_DIR: ${{ runner.temp }}/mesh-confirm
        run: |
          mkdir -p "$MESH_CONFIRM_BROWSER_DIR"
          go test ./internal/apps -run '^TestConfirmationBrowserPages$' -count=1
          node web/app-pill/tests/confirm.mjs "$MESH_CONFIRM_BROWSER_DIR"
      - name: Verify the pill docks at one position on every edge
        run: node web/app-pill/tests/snap.mjs

  race:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a tidy module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check private hosting boundary
        run: |
          python3 scripts/test-private-boundary.py
          scripts/check-private-hosting-boundary.sh
      - name: Race tests
        run: go test -race ./...

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh
        uses: ./.github/actions/apt-packages
        with:
          packages: zsh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        env:
          MESH_INTEGRATION_TIMEOUT: 60s
        run: ./scripts/verify.sh

  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Native fixtures (${{ matrix.platform }})
    # PRs and dispatches use hosted capacity, including every fork.
    runs-on: ${{ matrix.runner == 'macos-15' && github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","macOS","ARM64","mesh-mac"]') || matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'macos-15' && github.event_name == 'push' && github.ref == 'refs/heads/main' && 85 || (needs.changes.outputs.installed == 'true' && 80 || 40) }}
    outputs:
      linux_amd64: ${{ steps.result.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.result.outputs.linux_arm64 }}
      darwin_arm64: ${{ steps.result.outputs.darwin_arm64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for native fixtures
        id: native_go
        if: github.event_name != 'pull_request' || needs.changes.outputs.installed != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Set up Go for native and installed fixtures
        id: installed_go
        if: github.event_name == 'pull_request' && needs.changes.outputs.installed == 'true'
        uses: ./.github/actions/installed-go
      - name: Require the actual native platform
        id: platform
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify Unix sockets under long and symlinked scratch
        id: sockets
        if: matrix.platform != 'linux/arm64'
        run: |
          python3 scripts/native_socket_runner.py --output "$RUNNER_TEMP/native-socket-results.jsonl"
      - name: Verify Darwin process group cleanup
        id: darwin_cleanup
        if: matrix.platform == 'darwin/arm64'
        run: |
          python3 -B scripts/test-native-socket-runner.py ProcessTest BinaryTest
          python3 -B integration/helpers/native_enrollment_test.py \
            NativeEnrollmentTest.test_owned_zombie_group_is_pending_until_reaped \
            NativeEnrollmentTest.test_nested_cli_ssh_timeout_joins_with_inherited_output \
            NativeEnrollmentTest.test_daemon_needing_escalation_is_joined_within_eight_seconds
      - name: Refuse the integration supervisor before creating anything
        id: supervisor
        # Linux runs these controls inside the integration suite.
        if: runner.os == 'macOS'
        run: python3 scripts/test-verify-runner.py SourceContractTest
      - name: Verify native authentication regressions
        id: auth
        if: matrix.platform != 'linux/amd64'
        run: |
          go test -race -count=1 -timeout=180s -run 'Test(QueriedKeyMustNotOwnAuthenticatedSSHGrant|BootstrapReapprovalMustNotHealBareGrant|BootstrapMustSerializeWithDeviceRevocation|GrantLockMustRespectHandshakeCancellation|ManagedGrantWriterBoundsLockContention|GrantPolicyRejectsSpecialFilesWithoutBlocking|PublishedGrantSurvivesOtherAndIdempotentWriterContention|GrantContentionReleasesRealControlSlotBeforeUnlock|UpdaterPolicyFIFOReleasesRealControlSlot|UpdaterPolicyUnsafeSnapshotsRejectRealTLS)$' ./internal/identity ./internal/transport ./internal/sshd ./internal/daemon
      - name: Verify the Darwin installer activates launchd
        id: installer
        if: matrix.platform == 'darwin/arm64'
        run: go test -race -count=1 -run '^TestDarwinInstallerLaunchdActivation$' ./scripts/install
      - name: Verify native pinned-fleet enrollment
        id: enrollment
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mesh-enrollment.XXXXXX")
          trap 'rm -rf -- "$root"' EXIT
          MESH="$root/mesh"
          go build -o "$MESH" ./cmd/mesh
          mkdir -m 700 "$root/home" "$root/state" "$root/config" "$root/tmp"
          export HOME="$root/home"
          export MESH_STATE_DIR="$root/state"
          export MESH_CONFIG_DIR="$root/config"
          export TMPDIR="$root/tmp"
          export TMP="$TMPDIR" TEMP="$TMPDIR" PYTHONDONTWRITEBYTECODE=1
          python3 integration/helpers/native_enrollment.py "$MESH"
      - name: Verify Linux ARM64 enrollment and naming
        id: arm_enrollment
        if: matrix.platform == 'linux/arm64'
        run: |
          go test -race -count=1 -v -run '^Test(CheckedApproval|ApproveFleet)' ./internal/cli | tee "$RUNNER_TEMP/device-enrollment-test.log"
          grep -Fq -- '--- PASS: TestCheckedApprovalNativeBindingAndIdempotency ' "$RUNNER_TEMP/device-enrollment-test.log"
          grep -Fq -- '--- PASS: TestApproveFleetSystemSSHRequiresExistingHostKeyTrust ' "$RUNNER_TEMP/device-enrollment-test.log"
          go test -race -count=1 -run '^Test(DestinationNamePublishedAfterCommitAndRetryCoalesces|HostRenameErrorsAreStructuredAndWatchReadOnly|HostRenameCannotHealRevokedConnection)$' ./internal/daemon
          go test -race -count=1 ./internal/machinename
      - name: Verify Darwin retains its mapped executable
        id: mapped
        if: matrix.platform == 'darwin/arm64'
        run: |
          output="$RUNNER_TEMP/darwin-mapped-executable-test.log"
          go test -count=1 -run '^TestDarwinMappedExecutableSurvivesAtomicReplacement$' -v ./internal/updatebootstrap | tee "$output"
          grep -Fq -- '--- PASS: TestDarwinMappedExecutableSurvivesAtomicReplacement' "$output"
      - name: Verify launch agent inspection skips other applications' stubs
        id: launch_agent
        if: matrix.platform == 'darwin/arm64'
        run: |
          output="$RUNNER_TEMP/darwin-launch-agent-test.log"
          go test -count=1 -run '^TestInspectDaemonService' -v ./internal/updatebootstrap | tee "$output"
          grep -Fq -- '--- PASS: TestInspectDaemonServiceSkipsLaunchAgentsWithoutLabel' "$output"
          grep -Fq -- '--- PASS: TestInspectDaemonServiceFailsOnMeshAgentWithoutLabel' "$output"
      - name: Exercise old local cutover and authenticated fleet recovery
        id: cutover
        env:
          AUTH_CUTOVER_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-device-auth-cutover.sh "$RUNNER_TEMP/auth-cutover"
      - name: Verify native retained terminal and authenticated source transition
        id: naming
        env:
          NAMING_PROOF_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-machine-naming.sh "$RUNNER_TEMP/machine-naming"
      - name: Verify recovery cancellation, rejection and mapped helper identity
        id: recovery_controls
        if: matrix.platform == 'darwin/arm64'
        run: |
          mkdir -p "$RUNNER_TEMP/helper-recovery"
          go test -race ./internal/updateinstall -run 'TestHelperRecovery|TestHelperProcess|TestHelperLaunchdTarget|TestLaunchdHelperPID|TestUpgradeHelper|TestFailedRollback|TestOriginalInode|TestDarwinMappedExecutable' -count=1 -timeout=180s 2>&1 | tee "$RUNNER_TEMP/helper-recovery/race-tests.log"
      - name: Recover historical helper and run published bridge chain
        id: bridge
        if: matrix.platform != 'linux/arm64'
        env:
          HELPER_RECOVERY_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/helper-recovery"
          git rev-parse HEAD > "$RUNNER_TEMP/helper-recovery/source-sha.txt"
          go env GOHOSTOS GOHOSTARCH > "$RUNNER_TEMP/helper-recovery/native-platform.txt"
          bash scripts/prove-helper-recovery.sh "$RUNNER_TEMP/helper-recovery"
      # These checks can use the same native manager, console and listener as the
      # preceding fixtures. Run them only after the native steps finish.
      - name: Exercise signed updates and preserved sessions with the native manager
        id: installed_proof
        if: github.event_name == 'pull_request' && needs.changes.outputs.installed == 'true'
        env:
          INSTALLED_CATCHUP_PLATFORM: ${{ matrix.platform }}
          MESH_HARNESS_SOURCE: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/prove-installed-catchup.py "$RUNNER_TEMP/installed-pr" --native-preflight --pull-request
      - name: Verify native services and listeners stop after fixture errors
        id: installed_cleanup
        if: github.event_name == 'pull_request' && needs.changes.outputs.installed == 'true' && matrix.platform != 'linux/arm64'
        env:
          MESH_TEST_NATIVE_MANAGER: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          log="$RUNNER_TEMP/installed-pr/cleanup.log"
          python3 -B scripts/test-installed-catchup.py \
            NativeServiceTest.test_exception_after_launch_stops_real_service \
            InstalledCleanupTest.test_terminal_failure_still_stops_actual_listener_and_both_units 2>&1 | tee "$log"
          grep -q '^Ran 2 tests in ' "$log"
          test "$(tail -n 1 "$log")" = OK
      - name: Upload native fixture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-fixtures-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/native-socket-results.jsonl
            ${{ runner.temp }}/native-socket-results.schedule.json
            ${{ runner.temp }}/auth-cutover
            ${{ runner.temp }}/darwin-*-test.log
            ${{ runner.temp }}/device-enrollment-test.log
            ${{ runner.temp }}/machine-naming
            ${{ runner.temp }}/helper-recovery
          retention-days: 7
      - name: Upload installed fixture evidence
        if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.installed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-pr-${{ matrix.runner }}
          path: ${{ runner.temp }}/installed-pr
          retention-days: 7
      - name: Record completed native fixture checks
        id: result
        env:
          PLATFORM: ${{ matrix.platform }}
          INSTALLED_REQUIRED: ${{ needs.changes.outputs.installed }}
          NATIVE_GO: ${{ steps.native_go.outcome }}
          INSTALLED_GO: ${{ steps.installed_go.outcome }}
          PLATFORM_CHECK: ${{ steps.platform.outcome }}
          SOCKETS: ${{ steps.sockets.outcome }}
          DARWIN_CLEANUP: ${{ steps.darwin_cleanup.outcome }}
          SUPERVISOR: ${{ steps.supervisor.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          INSTALLER: ${{ steps.installer.outcome }}
          ENROLLMENT: ${{ steps.enrollment.outcome }}
          ARM_ENROLLMENT: ${{ steps.arm_enrollment.outcome }}
          MAPPED: ${{ steps.mapped.outcome }}
          LAUNCH_AGENT: ${{ steps.launch_agent.outcome }}
          CUTOVER: ${{ steps.cutover.outcome }}
          NAMING: ${{ steps.naming.outcome }}
          RECOVERY_CONTROLS: ${{ steps.recovery_controls.outcome }}
          BRIDGE: ${{ steps.bridge.outcome }}
          INSTALLED_PROOF: ${{ steps.installed_proof.outcome }}
          INSTALLED_CLEANUP: ${{ steps.installed_cleanup.outcome }}
        run: |
          require_steps() {
            local expected=$1 name
            shift
            for name in "$@"; do
              if [[ ${!name} != "$expected" ]]; then
                echo "::error::$PLATFORM $name reported '${!name}', expected '$expected'."
                return 1
              fi
            done
          }

          amd64_or_darwin=success
          auth=success
          arm_enrollment=skipped
          darwin=skipped
          case "$PLATFORM" in
            linux/amd64) auth=skipped ;;
            linux/arm64) amd64_or_darwin=skipped; arm_enrollment=success ;;
            darwin/arm64) darwin=success ;;
            *) echo "::error::Unexpected native platform: $PLATFORM"; exit 1 ;;
          esac

          require_steps success PLATFORM_CHECK ENROLLMENT CUTOVER NAMING
          require_steps "$amd64_or_darwin" SOCKETS BRIDGE
          require_steps "$auth" AUTH
          require_steps "$arm_enrollment" ARM_ENROLLMENT
          require_steps "$darwin" DARWIN_CLEANUP SUPERVISOR INSTALLER MAPPED LAUNCH_AGENT RECOVERY_CONTROLS

          case "$INSTALLED_REQUIRED" in
            true)
              require_steps success INSTALLED_GO INSTALLED_PROOF
              require_steps skipped NATIVE_GO
              require_steps "$amd64_or_darwin" INSTALLED_CLEANUP
              suite=installed
              ;;
            false)
              require_steps success NATIVE_GO
              require_steps skipped INSTALLED_GO INSTALLED_PROOF INSTALLED_CLEANUP
              suite=native
              ;;
            *) echo "::error::Invalid installed fixture selection: $INSTALLED_REQUIRED"; exit 1 ;;
          esac

          printf '%s=%s\n' "${PLATFORM//\//_}" "$suite" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      snapshot: ${{ steps.snapshot.outcome }}
      snapshot_contract: ${{ steps.snapshot_contract.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      # install-only skips the action's schema check; golangci-lint run ignores unknown keys.
      - name: Verify golangci-lint configuration schema
        run: golangci-lint config verify
      - name: Verify CI scheduling and fixture controls
        run: |
          python3 -B scripts/test-ci-scheduling.py
          python3 -B scripts/test-ci-changes.py
          python3 -B scripts/test-helper-recovery-gate.py
          python3 -B scripts/test-native-socket-runner.py
          python3 -B scripts/test-client-interrupt.py DiagnosticTest.test_registered_vehicle_runs_only_one_diagnostic_job_and_cannot_publish
          python3 -B scripts/test-fixture-tls.py
          python3 -B scripts/test-published-releases.py
          python3 -B integration/helpers/enrollment_snapshot_test.py
          python3 -B integration/helpers/native_enrollment_test.py
      - name: Verify CI download failure fixtures
        run: python3 scripts/test-ci-downloads.py
      - name: Verify installed release gate wiring
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/test-installed-gate-wiring.py
          python3 scripts/test-installed-catchup.py
          python3 scripts/test-installed-prepared.py
          python3 scripts/test-installed-workflow.py
          python3 scripts/test-record-update-preparation.py
          python3 scripts/test-publication-jobs.py
          python3 scripts/test-publication-workflow.py
      - name: Install pinned ShellCheck, Ruff, and Lefthook
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/gates-tools"
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/astral-sh/ruff/releases/download/0.16.9/ruff-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/ruff.tar.gz"
          echo "1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13  $RUNNER_TEMP/ruff.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/evilmartians/lefthook/releases/download/v2.1.15/lefthook_2.1.15_Linux_x86_64.gz -o "$RUNNER_TEMP/lefthook.gz"
          echo "b3ed1e83389d0a98b5f243a8a1afcb0fdfad527834f87170f2a2ff9ddfe0f836  $RUNNER_TEMP/lefthook.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/lefthook.gz" > "$RUNNER_TEMP/gates-tools/lefthook"
          chmod +x "$RUNNER_TEMP/gates-tools/lefthook"
          echo "$RUNNER_TEMP/gates-tools" >> "$GITHUB_PATH"
      - name: Full gates
        run: ./scripts/gates.sh --report-dir "$RUNNER_TEMP/gates-reports"
      - name: Prove staged hooks in a linked worktree
        if: always()
        run: bash scripts/prove-hooks.sh "$RUNNER_TEMP/gates-reports/hooks"
      - name: Prove planted violations and baseline updates
        if: always()
        run: python3 .gates/prove.py --evidence "$RUNNER_TEMP/gates-reports/proofs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gates-reports
          path: ${{ runner.temp }}/gates-reports
          retention-days: 7
      - name: govulncheck v1.7.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Verify opt-in native fixture controls
        run: >-
          go test -race -tags=mesh_installed_fixture -count=1 -timeout=120s
          -run '^(TestInstalledStartMarkerReplacesFile|TestRecorder.*|TestErrorClassificationPreservesKnownCausesWithoutText|TestServerLifecycle.*|TestDaemonLifecycle.*)$'
          ./cmd/mesh ./internal/transporttrace ./internal/transport ./internal/daemon
      - name: Verify default-branch failure fixtures
        run: python3 scripts/test-check-default-branch.py
      - name: Require main as the repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-default-branch.py '${{ github.repository }}'
      - name: Verify release and installer source contracts
        run: ./scripts/check-packaging.sh
      - name: Build snapshot packages
        id: snapshot
        if: needs.changes.outputs.packaging == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify snapshot archives
        id: snapshot_contract
        if: needs.changes.outputs.packaging == 'true'
        run: ./scripts/check-packaging.sh dist

  gate:
    name: Complete CI gate
    permissions:
      statuses: write
    if: ${{ always() && !inputs.client_interrupt }}
    needs: [changes, quality, race, integration, native, app-pill]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - name: Require every CI job
        id: verdict
        if: ${{ success() && !cancelled() }}
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BROWSER: ${{ needs.changes.outputs.browser }}
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          INSTALLED_REQUIRED: ${{ needs.changes.outputs.installed }}
          RACE: ${{ needs.race.result }}
          INTEGRATION: ${{ needs.integration.result }}
          NATIVE: ${{ needs.native.result }}
          NATIVE_LINUX_AMD64: ${{ needs.native.outputs.linux_amd64 }}
          NATIVE_LINUX_ARM64: ${{ needs.native.outputs.linux_arm64 }}
          NATIVE_DARWIN_ARM64: ${{ needs.native.outputs.darwin_arm64 }}
          APP_PILL: ${{ needs.app-pill.result }}
          SNAPSHOT: ${{ needs.quality.outputs.snapshot }}
          SNAPSHOT_CONTRACT: ${{ needs.quality.outputs.snapshot_contract }}
        run: |
          require() {
            local decision=$1 name=$2 actual=$3 expected
            case "$decision" in
              true) expected=success ;;
              false) expected=skipped ;;
              *) echo "::error::Invalid CI path decision for $name: $decision"; return 1 ;;
            esac
            if [[ $actual != "$expected" ]]; then
              echo "::error::$name reported '$actual', expected '$expected'."
              return 1
            fi
          }

          require true changes "$CHANGES"
          require true quality "$QUALITY"
          case "$CODE/$INSTALLED_REQUIRED" in
            true/true) native_expected=installed ;;
            true/false) native_expected=native ;;
            false/false) native_expected='' ;;
            *) echo '::error::Invalid native fixture selection.'; exit 1 ;;
          esac
          if [[ $CODE == false && ( $BROWSER != false || $PACKAGING != false ) ]]; then
            echo '::error::A documentation-only change cannot select product checks.'
            exit 1
          fi
          require "$CODE" race "$RACE"
          require "$CODE" integration "$INTEGRATION"
          require "$CODE" native "$NATIVE"
          for platform in NATIVE_LINUX_AMD64 NATIVE_LINUX_ARM64 NATIVE_DARWIN_ARM64; do
            if [[ ${!platform} != "$native_expected" ]]; then
              echo "::error::$platform reported '${!platform}', expected '$native_expected'."
              exit 1
            fi
          done
          require "$BROWSER" app-pill "$APP_PILL"
          require "$PACKAGING" snapshot "$SNAPSHOT"
          require "$PACKAGING" snapshot-contract "$SNAPSHOT_CONTRACT"

      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report the real CI verdict on the tested commit
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/cask-updates' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULT: ${{ steps.verdict.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
            -f context="Complete CI gate" -f state="$state" -f target_url="$RUN_URL" \
            -f description="Dispatched CI: $RESULT"
