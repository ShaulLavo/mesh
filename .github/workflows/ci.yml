name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      client_interrupt:
        description: 'Diagnostic only: prepare the original PC fixture and observe one interrupted adoption'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-interrupt-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.client_interrupt
    name: Diagnostic only, one original-client interrupted adoption
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch only the immutable failed product source reference
        run: git fetch --no-tags --depth=1 https://github.com/ShaulLavo/mesh.git e46caa27a11a534345376df844cf30566d034efa
      - name: Refuse occupied canonical units before any native fixture work
        run: |
          mkdir -p "$RUNNER_TEMP/client-interrupt-diagnostic"
          git rev-parse HEAD > "$RUNNER_TEMP/client-interrupt-diagnostic/source-sha.txt"
          python3 -B scripts/diagnose-client-interrupt.py --check-host > "$RUNNER_TEMP/client-interrupt-diagnostic/host-baseline.json"
      - name: Install the external observer on this disposable runner
        run: sudo apt-get update && sudo apt-get install -y strace
      - uses: ./.github/actions/installed-go
      - name: Prepare the private PC fixture and observe one pc-interrupt
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/diagnose-client-interrupt.py --output "$RUNNER_TEMP/client-interrupt-diagnostic"
      - name: Verify native and preparation cleanup
        if: always()
        run: |
          python3 -B scripts/diagnose-client-interrupt.py --verify-cleanup --output "$RUNNER_TEMP/client-interrupt-diagnostic"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: client-interrupt-diagnostic
          path: ${{ runner.temp }}/client-interrupt-diagnostic
          retention-days: 7

  changes:
    if: ${{ !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.paths.outputs.code == 'true' }}
      update_proofs: ${{ github.event_name == 'pull_request' && steps.update_paths.outputs.updates == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**/*.md'
              - '!README.md'
              - '!AGENTS.md'
              - '!LICENSE'
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: update_paths
        with:
          filters: |
            updates:
              - 'cmd/**'
              - 'internal/cli/**'
              - 'internal/release/**'
              - 'internal/releasedocuments/**'
              - 'internal/update*/**'
              - 'internal/storage/**'
              - 'internal/worker/**'
              - 'internal/session/**'
              - 'internal/protocol/**'
              - 'internal/daemon/**'
              - 'db/**'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
              - '.github/workflows/*'
              - '.github/actions/installed-go/**'

  mac-turn:
    # One mesh-mac runner serves every trusted Darwin leg, and GitHub gives it
    # whichever queued job it picks. A same-repository PR's Mac legs wait here,
    # on a hosted runner, until no main CI run (the publish path) is queued or
    # running. Main, manual, fork and draft runs pass at once.
    if: ${{ !inputs.client_interrupt }}
    name: Wait for main CI before Mac legs
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/wait-for-main-ci.py
          sparse-checkout-cone-mode: false
      - name: Wait until no main CI run is queued or running
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: python3 -B scripts/wait-for-main-ci.py

  app-pill:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Reusable floating pill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
      - run: pnpm --dir web/app-pill install --frozen-lockfile
      - run: pnpm --dir web/app-pill build
      - name: Require current embedded assets
        run: git diff --exit-code -- internal/apppill/assets
      - run: pnpm --dir web/app-pill test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install confirmation browser engines
        # A hang cap, not a speed limit: the main archive can serve the 126 MB of
        # browser dependencies at under 500 kB/s, which alone takes 4 to 5 minutes.
        timeout-minutes: 25
        run: |
          # The runner's regional mirror (Azure or AWS, varying by image) can
          # stall for hours; send apt to the main archive whatever host it is.
          for file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$file" ] || continue
            sudo sed -i -E 's#https?://[a-z0-9.-]+\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$file"
          done
          grep -rhoE 'https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | sort -u | sed 's/^/apt archive host: /'
          pnpm --dir web/app-pill exec playwright install --with-deps chromium webkit
      - name: Verify desktop and mobile confirmation guards
        env:
          MESH_CONFIRM_BROWSER_DIR: ${{ runner.temp }}/mesh-confirm
        run: |
          mkdir -p "$MESH_CONFIRM_BROWSER_DIR"
          go test ./internal/apps -run '^TestConfirmationBrowserPages$' -count=1
          node web/app-pill/tests/confirm.mjs "$MESH_CONFIRM_BROWSER_DIR"
      - name: Verify the pill docks at one position on every edge
        run: node web/app-pill/tests/snap.mjs

  race:
    if: ${{ !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a tidy module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check private hosting boundary
        run: |
          python3 scripts/test-private-boundary.py
          scripts/check-private-hosting-boundary.sh
      - name: Race tests
        run: go test -race ./...

  integration:
    if: ${{ !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        env:
          MESH_INTEGRATION_TIMEOUT: 60s
        run: ./scripts/verify.sh

  test:
    name: Race tests and integrations
    if: ${{ always() && !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [race, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify test scheduling and aggregate controls
        run: python3 -B scripts/test-ci-scheduling.py
      - name: Require races and integrations
        env:
          RACE: ${{ needs.race.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          [[ $RACE == success && $INTEGRATION == success ]]

  socket-portability:
    needs: [changes, mac-turn]
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Native socket and daemon fixtures (${{ matrix.runner }})
    # Trusted Darwin legs (main pushes, manual runs, same-repository PRs) run on
    # the owner's Mac runner; fork PRs stay hosted. The Mac job first waits in
    # the Mac FIFO for up to 45 minutes, so its hang cap carries that wait.
    runs-on: ${{ matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","mesh-mac"]') || matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 55 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Verify full daemon suite under long and symlinked scratch
        shell: bash
        run: |
          python3 scripts/test-native-socket-runner.py
          python3 scripts/native_socket_runner.py --output "$RUNNER_TEMP/native-socket-results.jsonl"
      - name: Refuse the integration supervisor before creating anything
        # Linux runs these controls inside the integration suite.
        if: runner.os == 'macOS'
        run: python3 scripts/test-verify-runner.py SourceContractTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-socket-results-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/native-socket-results.jsonl
            ${{ runner.temp }}/native-socket-results.schedule.json
          retention-days: 7

  auth-cutover:
    needs: [changes, mac-turn]
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Device auth cutover (${{ matrix.platform }})
    # Trusted Darwin legs run on the owner's Mac runner after a Mac FIFO wait.
    runs-on: ${{ matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","mesh-mac"]') || matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Require the actual native platform
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify fixture TLS and published artifact boundaries
        run: |
          python3 scripts/test-fixture-tls.py
          python3 scripts/test-published-releases.py
      - name: Verify native authentication regressions
        run: |
          go test -race -count=1 -timeout=180s -run 'Test(QueriedKeyMustNotOwnAuthenticatedSSHGrant|BootstrapReapprovalMustNotHealBareGrant|BootstrapMustSerializeWithDeviceRevocation|GrantLockMustRespectHandshakeCancellation|ManagedGrantWriterBoundsLockContention|GrantPolicyRejectsSpecialFilesWithoutBlocking|PublishedGrantSurvivesOtherAndIdempotentWriterContention|GrantContentionReleasesRealControlSlotBeforeUnlock|UpdaterPolicyFIFOReleasesRealControlSlot|UpdaterPolicyUnsafeSnapshotsRejectRealTLS|DarwinInstallerLaunchdActivation)$' ./internal/identity ./internal/transport ./internal/sshd ./internal/daemon ./scripts/install
      - name: Verify opt-in transport observer fixture
        run: go test -race -tags=mesh_installed_fixture -count=1 -timeout=120s -run '^(TestRecorder.*|TestErrorClassificationPreservesKnownCausesWithoutText|TestServerLifecycle.*|TestDaemonLifecycle.*)$' ./internal/transporttrace ./internal/transport ./internal/daemon
      - name: Verify native pinned-fleet enrollment
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/device-enrollment-test.log"
          go test -race -count=1 -timeout=180s -v -run '^Test(CheckedApproval|ApproveFleet)' ./internal/cli | tee "$output"
          command grep -Fq -- '--- PASS: TestCheckedApprovalNativeBindingAndIdempotency ' "$output"
          command grep -Fq -- '--- PASS: TestApproveFleetSystemSSHRequiresExistingHostKeyTrust ' "$output"
          python3 integration/helpers/enrollment_snapshot_test.py
          python3 integration/helpers/native_enrollment_test.py
          root=$(mktemp -d "$RUNNER_TEMP/mesh-enrollment.XXXXXX")
          trap 'status=$?; if (( status == 0 )); then rm -rf -- "$root"; else echo "retained enrollment paths: $root" >&2; fi' EXIT
          MESH="$root/mesh"
          go build -o "$MESH" ./cmd/mesh
          mkdir -m 700 "$root/home" "$root/state" "$root/config" "$root/tmp"
          export HOME="$root/home"
          export MESH_STATE_DIR="$root/state"
          export MESH_CONFIG_DIR="$root/config"
          export TMPDIR="$root/tmp"
          export TMP="$TMPDIR" TEMP="$TMPDIR" PYTHONDONTWRITEBYTECODE=1
          python3 integration/helpers/native_enrollment.py "$MESH"
      - name: Verify Darwin retains its mapped executable
        if: matrix.platform == 'darwin/arm64'
        run: |
          output="$RUNNER_TEMP/darwin-mapped-executable-test.log"
          go test -count=1 -run '^TestDarwinMappedExecutableSurvivesAtomicReplacement$' -v ./internal/updatebootstrap | tee "$output"
          grep -Fq -- '--- PASS: TestDarwinMappedExecutableSurvivesAtomicReplacement' "$output"
      - name: Verify launch agent inspection skips other applications' stubs
        if: matrix.platform == 'darwin/arm64'
        run: |
          output="$RUNNER_TEMP/darwin-launch-agent-test.log"
          go test -count=1 -run '^TestInspectDaemonService' -v ./internal/updatebootstrap | tee "$output"
          grep -Fq -- '--- PASS: TestInspectDaemonServiceSkipsLaunchAgentsWithoutLabel' "$output"
          grep -Fq -- '--- PASS: TestInspectDaemonServiceFailsOnMeshAgentWithoutLabel' "$output"
      - name: Exercise old local cutover and authenticated fleet recovery
        env:
          AUTH_CUTOVER_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-device-auth-cutover.sh "$RUNNER_TEMP/auth-cutover"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-auth-cutover-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/auth-cutover
            ${{ runner.temp }}/darwin-mapped-executable-test.log
            ${{ runner.temp }}/device-enrollment-test.log
          retention-days: 7

  machine-naming:
    needs: [changes, mac-turn]
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Destination naming (${{ matrix.platform }})
    # Trusted Darwin legs run on the owner's Mac runner after a Mac FIFO wait.
    runs-on: ${{ matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","mesh-mac"]') || matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Require the actual native platform
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify destination persistence, publication and authentication
        if: matrix.platform != 'linux/amd64'
        run: |
          set -euo pipefail
          go test -race -count=1 ./internal/machinename ./internal/protocol
          if [[ "$(go env GOHOSTOS)" == darwin ]]; then
            output="$RUNNER_TEMP/machine-naming-daemon.log"
            go test -race -count=1 -v -run '^Test(DestinationNamePublishedAfterCommitAndRetryCoalesces|HostRenameErrorsAreStructuredAndWatchReadOnly|HostRenameCannotHealRevokedConnection)$' ./internal/daemon | tee "$output"
            for test in TestDestinationNamePublishedAfterCommitAndRetryCoalesces TestHostRenameErrorsAreStructuredAndWatchReadOnly TestHostRenameCannotHealRevokedConnection; do
              grep -Fq -- "--- PASS: $test " "$output"
            done
          else
            go test -race -count=1 ./internal/daemon
          fi
      - name: Verify native retained terminal and authenticated source transition
        env:
          NAMING_PROOF_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-machine-naming.sh "$RUNNER_TEMP/machine-naming"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: machine-naming-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/machine-naming
            ${{ runner.temp }}/machine-naming-daemon.log
          retention-days: 7

  gates:
    if: ${{ !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      # install-only skips the action's schema check; golangci-lint run ignores unknown keys.
      - name: Verify golangci-lint configuration schema
        run: golangci-lint config verify
      - name: Verify CI download failure fixtures
        run: python3 scripts/test-ci-downloads.py
      - name: Verify installed release gate wiring
        run: |
          python3 scripts/test-installed-gate-wiring.py
          python3 scripts/test-installed-clock.py
          python3 scripts/test-installed-prepared.py
          python3 scripts/test-installed-workflow.py
          python3 scripts/test-publication-jobs.py
          python3 scripts/test-publication-workflow.py
      - name: Install pinned ShellCheck, Ruff, and Lefthook
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/gates-tools"
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/astral-sh/ruff/releases/download/0.16.9/ruff-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/ruff.tar.gz"
          echo "1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13  $RUNNER_TEMP/ruff.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/evilmartians/lefthook/releases/download/v2.1.15/lefthook_2.1.15_Linux_x86_64.gz -o "$RUNNER_TEMP/lefthook.gz"
          echo "b3ed1e83389d0a98b5f243a8a1afcb0fdfad527834f87170f2a2ff9ddfe0f836  $RUNNER_TEMP/lefthook.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/lefthook.gz" > "$RUNNER_TEMP/gates-tools/lefthook"
          chmod +x "$RUNNER_TEMP/gates-tools/lefthook"
          echo "$RUNNER_TEMP/gates-tools" >> "$GITHUB_PATH"
      - name: Full gates
        run: ./scripts/gates.sh --report-dir "$RUNNER_TEMP/gates-reports"
      - name: Prove staged hooks in a linked worktree
        if: always()
        run: bash scripts/prove-hooks.sh "$RUNNER_TEMP/gates-reports/hooks"
      - name: Prove planted violations and baseline updates
        if: always()
        run: python3 .gates/prove.py --evidence "$RUNNER_TEMP/gates-reports/proofs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gates-reports
          path: ${{ runner.temp }}/gates-reports
          retention-days: 7

  vulnerability:
    if: ${{ !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck v1.7.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  packaging:
    if: ${{ !inputs.client_interrupt && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Packaging contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify default-branch failure fixtures
        run: python3 scripts/test-check-default-branch.py
      - name: Require main as the repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-default-branch.py '${{ github.repository }}'
      - name: Verify release and installer contracts
        run: ./scripts/check-packaging.sh dist

  helper-recovery:
    needs: [changes, mac-turn]
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Required native helper recovery
    uses: ./.github/workflows/helper-recovery.yml

  update-proofs:
    name: Required native update proofs
    needs: [changes, mac-turn]
    if: needs.changes.outputs.update_proofs == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/update-proofs.yml
    with:
      source_sha: ${{ github.sha }}

  installed-catchup:
    name: Required installed update proofs
    needs: [changes, update-proofs]
    if: needs.changes.outputs.update_proofs == 'true' && !github.event.pull_request.draft
    permissions:
      contents: read
      actions: read
    uses: ShaulLavo/mesh/.github/workflows/installed-catchup.yml@de505f5b83d7f53a08c5663d1cdf431b96af75b4
    with:
      harness_source: de505f5b83d7f53a08c5663d1cdf431b96af75b4
      worker_artifact_prefix: update-native
      worker_artifact_run: ${{ fromJSON(needs.update-proofs.outputs.worker_artifact_run) }}
      worker_artifact_source: ${{ needs.update-proofs.outputs.worker_artifact_source }}

  gate:
    name: Complete CI gate
    permissions:
      statuses: write
    if: ${{ always() && !inputs.client_interrupt }}
    needs: [changes, app-pill, test, socket-portability, auth-cutover, machine-naming, helper-recovery, update-proofs, installed-catchup, gates, vulnerability, packaging]
    runs-on: ubuntu-24.04
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - name: Require every CI job
        id: verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          APP_PILL: ${{ needs.app-pill.result }}
          TEST: ${{ needs.test.result }}
          SOCKET_PORTABILITY: ${{ needs.socket-portability.result }}
          AUTH_CUTOVER: ${{ needs.auth-cutover.result }}
          MACHINE_NAMING: ${{ needs.machine-naming.result }}
          HELPER_RECOVERY: ${{ needs.helper-recovery.result }}
          UPDATE_PROOFS_REQUIRED: ${{ needs.changes.outputs.update_proofs }}
          UPDATE_PROOFS: ${{ needs.update-proofs.result }}
          INSTALLED_CATCHUP: ${{ needs.installed-catchup.result }}
          GATES: ${{ needs.gates.result }}
          VULNERABILITY: ${{ needs.vulnerability.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          [[ $CHANGES == success ]] || exit 1
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          [[ $APP_PILL == "$expected" && $SOCKET_PORTABILITY == "$expected" && $AUTH_CUTOVER == "$expected" && $MACHINE_NAMING == "$expected" && $HELPER_RECOVERY == "$expected" ]] || exit 1
          [[ $TEST == success && $GATES == success && $VULNERABILITY == success && $PACKAGING == success ]] || exit 1
          case "$UPDATE_PROOFS_REQUIRED" in
            true) [[ $UPDATE_PROOFS == success && $INSTALLED_CATCHUP == success ]] || exit 1 ;;
            false) [[ $UPDATE_PROOFS == skipped && $INSTALLED_CATCHUP == skipped ]] || exit 1 ;;
            *) exit 1 ;;
          esac

      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report the real CI verdict on the tested commit
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/cask-updates' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULT: ${{ steps.verdict.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
            -f context="Complete CI gate" -f state="$state" -f target_url="$RUN_URL" \
            -f description="Dispatched CI: $RESULT"

  publish:
    name: Publish tested main commit
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: write
      statuses: write
      checks: read
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ github.sha }}
