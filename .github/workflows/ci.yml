name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.paths.outputs.code == 'true' }}
      update_proofs: ${{ github.event_name == 'pull_request' && steps.update_paths.outputs.updates == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**/*.md'
              - '!README.md'
              - '!AGENTS.md'
              - '!LICENSE'
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: update_paths
        with:
          filters: |
            updates:
              - 'cmd/**'
              - 'internal/cli/**'
              - 'internal/release/**'
              - 'internal/update*/**'
              - 'internal/storage/**'
              - 'internal/worker/**'
              - 'internal/session/**'
              - 'internal/protocol/**'
              - 'internal/daemon/**'
              - 'db/**'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/*release*'
              - 'scripts/*update-proof*'
              - 'scripts/*update-reader*'
              - 'scripts/*legacy*'
              - 'scripts/*metadata*'
              - 'scripts/upgrade-policy.json'
              - 'scripts/fixtures/release_transition.py'
              - 'scripts/fixtures/published_releases.py'
              - 'scripts/fixtures/tls.py'
              - '.github/workflows/*'

  app-pill:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Reusable floating pill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
      - run: pnpm --dir web/app-pill install --frozen-lockfile
      - run: pnpm --dir web/app-pill build
      - name: Require current embedded assets
        run: git diff --exit-code -- internal/apppill/assets
      - run: pnpm --dir web/app-pill test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install confirmation browser engines
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          pnpm --dir web/app-pill exec playwright install --with-deps chromium webkit
      - name: Verify desktop and mobile confirmation guards
        env:
          MESH_CONFIRM_BROWSER_DIR: ${{ runner.temp }}/mesh-confirm
        run: |
          mkdir -p "$MESH_CONFIRM_BROWSER_DIR"
          go test ./internal/apps -run '^TestConfirmationBrowserPages$' -count=1
          node web/app-pill/tests/confirm.mjs "$MESH_CONFIRM_BROWSER_DIR"
      - name: Verify the pill docks at one position on every edge
        run: node web/app-pill/tests/snap.mjs

  test:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Race tests and integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a tidy module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check private hosting boundary
        run: |
          python3 scripts/test-private-boundary.py
          scripts/check-private-hosting-boundary.sh
      - name: Race tests
        run: go test -race ./...
      - name: Integration tests
        env:
          MESH_INTEGRATION_TIMEOUT: 60s
        run: ./scripts/verify.sh

  socket-portability:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Native socket and daemon fixtures (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify full daemon suite under long and symlinked scratch
        shell: bash
        run: |
          python3 scripts/test-native-socket-runner.py
          python3 scripts/native_socket_runner.py --output "$RUNNER_TEMP/native-socket-results.jsonl"
      - name: Refuse the integration supervisor before creating anything
        # Linux runs these controls inside the integration suite.
        if: runner.os == 'macOS'
        run: python3 scripts/test-verify-runner.py SourceContractTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-socket-results-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/native-socket-results.jsonl
            ${{ runner.temp }}/native-socket-results.schedule.json
          retention-days: 7

  auth-cutover:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Device auth cutover (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the actual native platform
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify fixture TLS and published artifact boundaries
        run: |
          python3 scripts/test-fixture-tls.py
          python3 scripts/test-published-releases.py
      - name: Verify native authentication regressions
        run: |
          go test -race -count=1 -timeout=180s -run 'Test(QueriedKeyMustNotOwnAuthenticatedSSHGrant|BootstrapReapprovalMustNotHealBareGrant|BootstrapMustSerializeWithDeviceRevocation|GrantLockMustRespectHandshakeCancellation|ManagedGrantWriterBoundsLockContention|GrantPolicyRejectsSpecialFilesWithoutBlocking|PublishedGrantSurvivesOtherAndIdempotentWriterContention|GrantContentionReleasesRealControlSlotBeforeUnlock|UpdaterPolicyFIFOReleasesRealControlSlot|UpdaterPolicyUnsafeSnapshotsRejectRealTLS|DarwinInstallerLaunchdActivation)$' ./internal/identity ./internal/transport ./internal/sshd ./internal/daemon ./scripts/install
      - name: Verify native pinned-fleet enrollment
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/device-enrollment-test.log"
          go test -race -count=1 -timeout=180s -v -run '^Test(CheckedApproval|ApproveFleet)' ./internal/cli | tee "$output"
          command grep -Fq -- '--- PASS: TestCheckedApprovalNativeBindingAndIdempotency ' "$output"
          command grep -Fq -- '--- PASS: TestApproveFleetSystemSSHRequiresExistingHostKeyTrust ' "$output"
          python3 integration/helpers/enrollment_snapshot_test.py
          python3 integration/helpers/native_enrollment_test.py
          root=$(mktemp -d "$RUNNER_TEMP/mesh-enrollment.XXXXXX")
          trap 'status=$?; if (( status == 0 )); then rm -rf -- "$root"; else echo "retained enrollment paths: $root" >&2; fi' EXIT
          MESH="$root/mesh"
          go build -o "$MESH" ./cmd/mesh
          mkdir -m 700 "$root/home" "$root/state" "$root/config" "$root/tmp"
          export HOME="$root/home"
          export MESH_STATE_DIR="$root/state"
          export MESH_CONFIG_DIR="$root/config"
          export TMPDIR="$root/tmp"
          export TMP="$TMPDIR" TEMP="$TMPDIR" PYTHONDONTWRITEBYTECODE=1
          python3 integration/helpers/native_enrollment.py "$MESH"
      - name: Verify Darwin retains its mapped executable
        if: matrix.platform == 'darwin/arm64'
        run: |
          output="$RUNNER_TEMP/darwin-mapped-executable-test.log"
          go test -count=1 -run '^TestDarwinMappedExecutableSurvivesAtomicReplacement$' -v ./internal/updatebootstrap | tee "$output"
          grep -Fq -- '--- PASS: TestDarwinMappedExecutableSurvivesAtomicReplacement' "$output"
      - name: Exercise old local cutover and authenticated fleet recovery
        env:
          AUTH_CUTOVER_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-device-auth-cutover.sh "$RUNNER_TEMP/auth-cutover"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-auth-cutover-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/auth-cutover
            ${{ runner.temp }}/darwin-mapped-executable-test.log
            ${{ runner.temp }}/device-enrollment-test.log
          retention-days: 7

  machine-naming:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Destination naming (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the actual native platform
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify destination persistence, publication and authentication
        if: matrix.platform != 'linux/amd64'
        run: |
          set -euo pipefail
          go test -race -count=1 ./internal/machinename ./internal/protocol
          if [[ "$(go env GOHOSTOS)" == darwin ]]; then
            output="$RUNNER_TEMP/machine-naming-daemon.log"
            go test -race -count=1 -v -run '^Test(DestinationNamePublishedAfterCommitAndRetryCoalesces|HostRenameErrorsAreStructuredAndWatchReadOnly|HostRenameCannotHealRevokedConnection)$' ./internal/daemon | tee "$output"
            for test in TestDestinationNamePublishedAfterCommitAndRetryCoalesces TestHostRenameErrorsAreStructuredAndWatchReadOnly TestHostRenameCannotHealRevokedConnection; do
              grep -Fq -- "--- PASS: $test " "$output"
            done
          else
            go test -race -count=1 ./internal/daemon
          fi
      - name: Verify native retained terminal and authenticated source transition
        env:
          NAMING_PROOF_PLATFORM: ${{ matrix.platform }}
        run: scripts/prove-machine-naming.sh "$RUNNER_TEMP/machine-naming"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: machine-naming-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/machine-naming
            ${{ runner.temp }}/machine-naming-daemon.log
          retention-days: 7

  gates:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      # install-only skips the action's schema check; golangci-lint run ignores unknown keys.
      - name: Verify golangci-lint configuration schema
        run: golangci-lint config verify
      - name: Verify CI download failure fixtures
        run: python3 scripts/test-ci-downloads.py
      - name: Install pinned ShellCheck, Ruff, and Lefthook
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/gates-tools"
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/astral-sh/ruff/releases/download/0.16.9/ruff-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/ruff.tar.gz"
          echo "1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13  $RUNNER_TEMP/ruff.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP/gates-tools" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 https://github.com/evilmartians/lefthook/releases/download/v2.1.15/lefthook_2.1.15_Linux_x86_64.gz -o "$RUNNER_TEMP/lefthook.gz"
          echo "b3ed1e83389d0a98b5f243a8a1afcb0fdfad527834f87170f2a2ff9ddfe0f836  $RUNNER_TEMP/lefthook.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/lefthook.gz" > "$RUNNER_TEMP/gates-tools/lefthook"
          chmod +x "$RUNNER_TEMP/gates-tools/lefthook"
          echo "$RUNNER_TEMP/gates-tools" >> "$GITHUB_PATH"
      - name: Full gates
        run: ./scripts/gates.sh --report-dir "$RUNNER_TEMP/gates-reports"
      - name: Prove staged hooks in a linked worktree
        if: always()
        run: bash scripts/prove-hooks.sh "$RUNNER_TEMP/gates-reports/hooks"
      - name: Prove planted violations and baseline updates
        if: always()
        run: python3 .gates/prove.py --evidence "$RUNNER_TEMP/gates-reports/proofs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gates-reports
          path: ${{ runner.temp }}/gates-reports
          retention-days: 7

  vulnerability:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck v1.7.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  packaging:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Packaging contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify default-branch failure fixtures
        run: python3 scripts/test-check-default-branch.py
      - name: Require main as the repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-default-branch.py '${{ github.repository }}'
      - name: Verify release and installer contracts
        run: ./scripts/check-packaging.sh dist

  helper-recovery:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Required native helper recovery
    uses: ./.github/workflows/helper-recovery.yml

  update-proofs:
    name: Required native update proofs
    needs: changes
    if: needs.changes.outputs.update_proofs == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/update-proofs.yml
    with:
      source_sha: ${{ github.sha }}

  gate:
    name: Complete CI gate
    permissions:
      statuses: write
    if: always()
    needs: [changes, app-pill, test, socket-portability, auth-cutover, machine-naming, helper-recovery, update-proofs, gates, vulnerability, packaging]
    runs-on: ubuntu-24.04
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - name: Require every CI job
        id: verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          APP_PILL: ${{ needs.app-pill.result }}
          TEST: ${{ needs.test.result }}
          SOCKET_PORTABILITY: ${{ needs.socket-portability.result }}
          AUTH_CUTOVER: ${{ needs.auth-cutover.result }}
          MACHINE_NAMING: ${{ needs.machine-naming.result }}
          HELPER_RECOVERY: ${{ needs.helper-recovery.result }}
          UPDATE_PROOFS_REQUIRED: ${{ needs.changes.outputs.update_proofs }}
          UPDATE_PROOFS: ${{ needs.update-proofs.result }}
          GATES: ${{ needs.gates.result }}
          VULNERABILITY: ${{ needs.vulnerability.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          [[ $CHANGES == success ]] || exit 1
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          [[ $APP_PILL == "$expected" && $SOCKET_PORTABILITY == "$expected" && $AUTH_CUTOVER == "$expected" && $MACHINE_NAMING == "$expected" && $HELPER_RECOVERY == "$expected" ]] || exit 1
          [[ $TEST == success && $GATES == success && $VULNERABILITY == success && $PACKAGING == success ]] || exit 1
          case "$UPDATE_PROOFS_REQUIRED" in
            true) [[ $UPDATE_PROOFS == success ]] || exit 1 ;;
            false) [[ $UPDATE_PROOFS == skipped ]] || exit 1 ;;
            *) exit 1 ;;
          esac

      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report the real CI verdict on the tested commit
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/cask-updates' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULT: ${{ steps.verdict.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
            -f context="Complete CI gate" -f state="$state" -f target_url="$RUN_URL" \
            -f description="Dispatched CI: $RESULT"

  publish:
    name: Publish tested main commit
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      statuses: write
      checks: read
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ github.sha }}
