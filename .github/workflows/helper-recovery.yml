name: Local helper recovery

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-recovery:
    name: Native helper recovery (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: darwin/arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require actual native execution
        env:
          REQUIRED_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/helper-recovery"
          git rev-parse HEAD > "$RUNNER_TEMP/helper-recovery/source-sha.txt"
          go env GOHOSTOS GOHOSTARCH > "$RUNNER_TEMP/helper-recovery/native-platform.txt"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$REQUIRED_PLATFORM"
      - name: Verify required publication aggregate and rejection controls
        run: python3 scripts/test-helper-recovery-gate.py | tee "$RUNNER_TEMP/helper-recovery/publication-gate.log"
      - name: Verify recovery cancellation, rejection and mapped helper identity
        run: |
          go test -race ./internal/updateinstall ./internal/updatebootstrap ./internal/cli -run 'TestHelperRecovery|TestHelperProcess|TestHelperLaunchdTarget|TestLaunchdHelperPID|TestUpgradeHelper|TestFailedRollback|TestOriginalInode|TestDarwinMappedExecutable' -count=1 -timeout=180s 2>&1 | tee "$RUNNER_TEMP/helper-recovery/race-tests.log"
      - name: Verify shared acquisition and child-only TLS controls
        run: |
          python3 scripts/test-fixture-tls.py 2>&1 | tee "$RUNNER_TEMP/helper-recovery/tls-controls.log"
          python3 scripts/test-published-releases.py 2>&1 | tee "$RUNNER_TEMP/helper-recovery/acquisition-controls.log"
      - name: Recover historical helper and run published bridge chain
        env:
          HELPER_RECOVERY_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/prove-helper-recovery.sh "$RUNNER_TEMP/helper-recovery"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: helper-recovery-${{ strategy.job-index }}
          path: ${{ runner.temp }}/helper-recovery
          retention-days: 7
