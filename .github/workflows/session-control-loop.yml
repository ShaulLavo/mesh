name: Session control 30-run verification

on:
  push:
    branches: [fix/session-control-signal-race]
    paths: [.github/workflows/session-control-loop.yml]

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build once and run 30 isolated exercises
        shell: bash
        run: |
          scratch="$RUNNER_TEMP/session-control-loop"
          mkdir -p "$scratch"
          go build -o "$scratch/mesh" ./cmd/mesh
          failed=0
          for i in $(seq 1 30); do
            run="$scratch/run-$i"
            mkdir -p "$run/state" "$run/config"
            if MESH="$scratch/mesh" MESH_STATE_DIR="$run/state" MESH_CONFIG_DIR="$run/config" TMPDIR=/tmp \
               bash integration/session_control.sh >"$run/output.log" 2>&1; then
              echo "run $i PASS" | tee -a "$scratch/results.txt"
            else
              echo "run $i FAIL" | tee -a "$scratch/results.txt"
              cat "$run/output.log"
              failed=$((failed + 1))
            fi
          done
          echo "failures=$failed/30" | tee -a "$scratch/results.txt" "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: session-control-loop
          path: ${{ runner.temp }}/session-control-loop/**/*.log
          retention-days: 7
