name: Diagnostic untraced Linux EPERM vehicle

on:
  workflow_dispatch:
    inputs:
      driver_source:
        description: 'Exact independently reviewed diagnostic branch commit; must equal the dispatch SHA'
        required: true
        type: string
      hosted_sudo_kernel_journal:
        description: 'Allow the reviewed read-only hosted sudo -n journalctl fallback'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-linux-eperm-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.driver_source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact dispatch and driver identity
        env:
          DRIVER_SOURCE: ${{ inputs.driver_source }}
          DISPATCH_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$DRIVER_SOURCE" = "$DISPATCH_SOURCE"
          test "$(git rev-parse HEAD)" = "$DRIVER_SOURCE"
      - name: Pure vehicle controls
        run: python3 scripts/test-linux-eperm-vehicle.py
      - name: Healthy snapshot control then one original forward-only source
        env:
          DRIVER_SOURCE: ${{ inputs.driver_source }}
          HOSTED_SUDO_KERNEL_JOURNAL: ${{ inputs.hosted_sudo_kernel_journal }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/eperm-diagnostic"
          mkdir "$root"
          trap 'python3 scripts/linux-eperm-vehicle.py cleanup "$root"' EXIT
          flags=()
          if [[ $HOSTED_SUDO_KERNEL_JOURNAL == true ]]; then
            flags+=(--hosted-sudo-kernel-journal)
          fi
          python3 scripts/linux-eperm-vehicle.py run "$root" --driver-source "$DRIVER_SOURCE" "${flags[@]}" > "$root/vehicle.log" 2>&1
      - name: Confirm cleanup or preserve payloads when ownership is unknown
        if: always()
        run: |
          if [[ -d $RUNNER_TEMP/eperm-diagnostic ]]; then
            python3 scripts/linux-eperm-vehicle.py cleanup "$RUNNER_TEMP/eperm-diagnostic"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diagnostic-linux-eperm-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eperm-diagnostic/*.json
            ${{ runner.temp }}/eperm-diagnostic/*.log
            ${{ runner.temp }}/eperm-diagnostic/proof
          if-no-files-found: warn
          retention-days: 7
