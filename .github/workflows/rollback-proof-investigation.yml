name: Focused Linux catalog diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: focused-linux-catalog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    name: Diagnostic only, exact C4 AMD64 group 2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: vehicle
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b0002608614ad41bf92dd477b2ec961a791fa420
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Record compiler ownership before setup
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalog-control"
          test "$(git -C source rev-parse HEAD)" = b0002608614ad41bf92dd477b2ec961a791fa420
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C source branch --show-current)"
          test "$(git -C source rev-parse --is-shallow-repository)" = false
          git -C source merge-base --is-ancestor c0c899eea10a9c4f5916b0b629b736455d1d5a92 HEAD
          compiler="$RUNNER_TOOL_CACHE/go/1.27.4/x64"
          if [[ -e "$compiler" ]]; then
            printf 'pre-existing\n' > "$RUNNER_TEMP/catalog-control/compiler-owner"
          else
            printf '%s\n' "$compiler" > "$RUNNER_TEMP/catalog-control/compiler-owner"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Validate pinned inputs and run the unchanged diagnostic once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 vehicle/scripts/diagnostics/catalog/run-hosted.py
      - name: Remove task-created compiler after its consumers stop
        if: always()
        run: |
          set -euo pipefail
          owner="$RUNNER_TEMP/catalog-control/compiler-owner"
          if [[ -f "$owner" && $(cat "$owner") == "$RUNNER_TOOL_CACHE/go/1.27.4/x64" && ! -e "$RUNNER_TEMP/catalog-control/retain-payloads" ]]; then
            rm -rf -- "$RUNNER_TOOL_CACHE/go/1.27.4/x64"
            rm -f -- "$RUNNER_TOOL_CACHE/go/1.27.4/x64.complete"
            test ! -e "$RUNNER_TOOL_CACHE/go/1.27.4/x64"
          fi
          if [[ -d "$RUNNER_TEMP/catalog-control" ]]; then
            printf '{"compilerPresent":%s,"payloadsRetained":%s}\n' \
              "$(test -e "$RUNNER_TOOL_CACHE/go/1.27.4/x64" && echo true || echo false)" \
              "$(test -e "$RUNNER_TEMP/catalog-control/retain-payloads" && echo true || echo false)" \
              > "$RUNNER_TEMP/catalog-control/compiler-cleanup.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: focused-linux-catalog-diagnostic-only
          path: |
            ${{ runner.temp }}/catalog-control
            ${{ runner.temp }}/catalog-evidence
          retention-days: 7
      - name: Verify task checkout cleanup
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -e "$RUNNER_TEMP/catalog-control/retain-payloads" ]]; then
            rm -rf -- "$GITHUB_WORKSPACE/source"
            test ! -e "$GITHUB_WORKSPACE/source"
          fi
          rm -rf -- "$GITHUB_WORKSPACE/vehicle"
          test ! -e "$GITHUB_WORKSPACE/vehicle"
