name: Installed clock calibration

on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: 'Existing complete reviewed native preparation run'
        required: true
        type: string
      producer_source:
        description: 'Exact recorded preparation source SHA'
        required: true
        type: string
      producer_prefix:
        description: 'Exact native preparation artifact prefix'
        required: true
        type: string
      measurement_scope:
        description: 'Measure prepared cohorts and all nine support profiles together, or select a subset'
        default: all
        type: choice
        options: [all, cohort, prepared, support]
      catalog_evidence:
        description: 'Enable only after composing the reviewed passive catalog source'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: installed-clock-calibration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  measure:
    if: inputs.measurement_scope != 'support'
    uses: ./.github/workflows/installed-catchup.yml
    with:
      harness_source: ${{ github.sha }}
      reusable_call: true
      worker_artifact_prefix: ${{ inputs.producer_prefix }}
      worker_artifact_run: ${{ fromJSON(inputs.producer_run) }}
      worker_artifact_source: ${{ inputs.producer_source }}
      calibration_only: true
      calibration_scope: ${{ inputs.measurement_scope == 'prepared' && 'prepared' || 'cohort' }}
      catalog_evidence: ${{ inputs.catalog_evidence }}

  support:
    if: inputs.measurement_scope == 'all' || inputs.measurement_scope == 'support'
    strategy:
      fail-fast: false
      matrix:
        profile: [adoption-all, adoption-interrupt, fresh]
    uses: ./.github/workflows/installed-catchup.yml
    with:
      harness_source: ${{ github.sha }}
      reusable_call: true
      calibration_only: true
      calibration_support: ${{ matrix.profile }}
