name: ARM64 chain-none recovery

on:
  workflow_dispatch:
    inputs:
      harness_source:
        description: 'Exact reviewed harness source SHA'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  recovery:
    uses: ./.github/workflows/installed-prepared.yml
    with:
      native_platform: linux/arm64
      mode: chain
      measurement_profile: none
      harness_source: ${{ inputs.harness_source }}
      worker_artifact_prefix: update-native
      worker_artifact_run: 43356291036
      worker_artifact_source: 3097dc167bcdcadc8a561fb0f443253b74bfd025
      calibration_only: true
