name: Temporary rollback proof investigation

on:
  push:
    branches: [fix/rollback-proof-flake]

permissions:
  contents: read

env:
  PROOF_PHASE: before

jobs:
  reproduce:
    name: ${{ matrix.platform }} rollback proof loop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            archive: mesh_linux_amd64.tar.gz
            runner: ubuntu-24.04
          - platform: darwin/arm64
            archive: mesh_darwin_arm64.tar.gz
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare isolated binaries
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ matrix.archive }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          export PATH=$HOME/.local/share/mise/shims:$PATH
          df -h "$RUNNER_TEMP" /tmp
          root=$(mktemp -d /tmp/mesh-proof-loop.XXXXXX)
          echo "PROOF_ROOT=$root" >> "$GITHUB_ENV"
          mkdir "$root/old"
          gh release download v0.1.52 --pattern "$ARCHIVE" --dir "$root/old"
          tar -xzf "$root/old/$ARCHIVE" -C "$root/old"
          go build -o "$root/candidate" ./cmd/mesh
          "$root/old/mesh" version --json
          "$root/candidate" version --json
          case "$(uname -sm)" in
            'Linux x86_64') actual=linux/amd64 ;;
            'Darwin arm64') actual=darwin/arm64 ;;
            *) echo 'unexpected runner architecture'; exit 1 ;;
          esac
          test "$actual" = "$PLATFORM"
      - name: Thirty proofs under CPU load and deterministic checkpoint regression
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          export PATH=$HOME/.local/share/mise/shims:$PATH
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          root = Path(os.environ['PROOF_ROOT'])
          phase = os.environ['PROOF_PHASE']
          environment = dict(os.environ)
          for name in ('MESH_DEPTH', 'MESH_HOST_ID', 'MESH_SESSION_ID'):
              environment.pop(name, None)
          environment['MESH_SHORT_TMP'] = str(root)
          environment['MESH'] = str(root / 'candidate')
          environment['TMPDIR'] = str(root)
          environment['EVIDENCE'] = str(root)
          if hasattr(os, 'sched_getaffinity'):
              allowed = sorted(os.sched_getaffinity(0))
              os.sched_setaffinity(0, allowed[:2])
          burners = [subprocess.Popen([sys.executable, '-c',
                     'while True: sum(i*i for i in range(10000))']) for _ in range(4)]
          failures = 0
          unexpected = []
          try:
              for index in range(1, 31):
                  started = time.monotonic()
                  result = subprocess.run(['bash', 'scripts/prove-release-transition.sh',
                      str(root / 'old/mesh'), str(root / 'candidate'), os.environ['PLATFORM'],
                      str(root / 'proofs')], env=environment, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  (root / f'{index:02d}.log').write_text(result.stdout)
                  error = next((line for line in result.stdout.splitlines()
                      if line.startswith('transition proof:')), '')
                  failures += bool(result.returncode)
                  if result.returncode and 'recovery record changed across' not in error:
                      unexpected.append(index)
                      print(result.stdout, flush=True)
                  print(f'{phase} {index}/30 exit={result.returncode} '
                        f'elapsed={time.monotonic()-started:.2f}s {error}', flush=True)
              print(f'RESULT platform={os.environ["PLATFORM"]} phase={phase} '
                    f'failures={failures}/30 cpu_load_workers=4', flush=True)
              if phase == 'before':
                  source = Path('scripts/prove-release-transition.sh').read_text()
                  source = source.replace('recovery_before=',
                      'cp "$state/s/$session/recovery.json" "$EVIDENCE/recovery-before.json"\nrecovery_before=', 1)
                  source = source.replace('[[ $recovery_after ==',
                      'cp "$state/s/$session/recovery.json" "$EVIDENCE/recovery-after.json"\n'
                      'diff -u "$EVIDENCE/recovery-before.json" "$EVIDENCE/recovery-after.json" || true\n'
                      '[[ $recovery_after ==', 1)
                  instrumented = root / 'instrumented-proof.sh'
                  instrumented.write_text(source)
                  result = subprocess.run(['bash', str(instrumented), str(root / 'old/mesh'),
                      str(root / 'candidate'), os.environ['PLATFORM'], str(root / 'instrument')],
                      env=environment, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print('INSTRUMENTED ORIGINAL PROOF', flush=True)
                  print(result.stdout, flush=True)
              result = subprocess.run(['bash', 'integration/release_transition_checkpoint.sh'],
                  env=environment, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(f'DETERMINISTIC REGRESSION phase={phase} exit={result.returncode}', flush=True)
              print(result.stdout, flush=True)
              if phase == 'before':
                  assert result.returncode != 0, 'unmodified proof unexpectedly passed forced checkpoint'
                  assert 'transition proof: recovery record changed across' in result.stdout, result.stdout
              else:
                  assert result.returncode == 0, result.stdout
                  assert failures == 0, f'{failures}/30 fixed proofs failed'
              assert not unexpected, unexpected
          finally:
              for burner in burners:
                  burner.terminate()
              for burner in burners:
                  burner.wait()
          PY
